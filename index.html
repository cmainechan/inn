<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Yard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #E7EFD8;
    --paper: #FFFEF6;
    --ink: #3F3530;
    --muted: #7C6F63;
    --line: #D3DCC0;
    --sun: #F6B93B;
    --pond: #4F86B5;
    --leaf: #5E8F4A;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .he {
    font-family: "Frank Ruhl Libre", "Times New Roman", "David", serif;
    direction: rtl;
    unicode-bidi: isolate;
    font-weight: 700;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: max(14px, env(safe-area-inset-top)) 14px max(40px, env(safe-area-inset-bottom));
  }

  /* Top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 12px; flex-wrap: wrap; }
  .title { display: flex; align-items: baseline; gap: 10px; margin: 0; font-weight: 600; font-size: 1.5rem; }
  .title .he { font-size: 1.9rem; color: var(--leaf); }
  .wallet { display: flex; align-items: center; gap: 8px; }
  .fish {
    background: var(--pond); color: #fff; font-weight: 600; font-size: 1.15rem;
    padding: 5px 14px; border-radius: 999px; border: 2.5px solid var(--ink);
    min-width: 76px; text-align: center; transition: transform .2s;
  }
  .fish.bump { transform: scale(1.15); }

  /* Buttons */
  .btn {
    font: inherit; font-weight: 600; color: var(--ink);
    background: var(--sun); border: 2.5px solid var(--ink); border-radius: 999px;
    padding: 6px 16px; cursor: pointer; box-shadow: 0 3px 0 var(--ink);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { background: #E6E1D6; color: var(--muted); cursor: default; box-shadow: 0 3px 0 #B8AFA2; border-color: #B8AFA2; }
  .btn.plain { background: var(--paper); }
  .btn:focus-visible, .spot:focus-visible, .tab:focus-visible, a:focus-visible { outline: 3px solid var(--pond); outline-offset: 3px; }

  /* Yard */
  .yard {
    position: relative; width: 100%; aspect-ratio: 16 / 11;
    border-radius: 26px; overflow: hidden; border: 3px solid var(--ink);
    background: #9DCC6E url("scene/garden.webp") center / cover no-repeat;
  }
  /* Evening and night are a colour wash over the daytime garden. */
  .tint { position: absolute; inset: 0; pointer-events: none; transition: background 1.5s ease; }
  .spot {
    position: absolute; width: 27%; aspect-ratio: 120 / 100;
    transform: translateX(-50%); padding: 0; border: 0; background: none;
    cursor: pointer; -webkit-tap-highlight-color: transparent; border-radius: 14px;
  }
  .spot.back { width: 23.5%; }
  .spot .empty-mark { opacity: .75; transition: opacity .2s; }
  .spot:hover .empty-mark { opacity: 1; }

  /* Art. Every object and cat image is a 480 x 400 canvas (120:100, the spot's shape),
     so the same percentages place a cat on any object. */
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .thumb { position: relative; width: 100%; max-width: 136px; aspect-ratio: 6 / 5; }
  .thumb .layer { position: absolute; }
  .cat-layer { position: absolute; pointer-events: none; }
  .frames { display: grid; }
  .frames > img { grid-area: 1 / 1; display: block; width: 100%; height: auto; opacity: 0; transition: opacity .9s ease; }
  .frames > img.on { opacity: 1; }
  .portrait-cat { width: 100%; max-width: 136px; }
  .portrait-cat img { display: block; width: 100%; height: auto; }
  .sil img { filter: brightness(0); opacity: .18; }

  .hint { color: var(--muted); margin: 10px 4px 18px; font-size: .95rem; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab {
    font: inherit; font-weight: 600; color: var(--ink); background: transparent;
    border: 2.5px solid transparent; border-radius: 999px; padding: 5px 16px; cursor: pointer;
  }
  .tab .he { margin-left: 6px; font-size: 1.1rem; color: var(--leaf); }
  .tab[aria-selected="true"] { background: var(--paper); border-color: var(--ink); }

  /* Shop + album */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px; }
  .card {
    background: var(--paper); border: 2px solid var(--line); border-radius: 18px;
    padding: 10px 10px 14px; text-align: center; display: flex; flex-direction: column; align-items: center;
  }
  .card .he { font-size: 1.6rem; line-height: 1.3; margin-top: 4px; }
  .card .tr { font-size: .95rem; }
  .card .en { color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
  .card .btn { margin-top: auto; }
  .tag { margin-top: auto; font-weight: 600; color: var(--leaf); padding: 7px 0; }

  .earn { margin-top: 26px; padding: 14px 16px; background: var(--paper); border: 2px dashed var(--line); border-radius: 18px; }
  .earn a { color: var(--pond); font-weight: 600; }

  /* Sheet */
  .overlay {
    position: fixed; inset: 0; background: rgba(40, 33, 28, .45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 30;
  }
  .overlay[hidden] { display: none; }
  .sheet {
    background: var(--paper); width: 100%; max-width: 520px; border: 3px solid var(--ink); border-bottom: 0;
    border-radius: 26px 26px 0 0; padding: 18px 18px calc(22px + env(safe-area-inset-bottom));
    animation: up .25s ease-out;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 { margin: 0 0 4px; font-weight: 600; font-size: 1.3rem; }
  .sheet .portrait { display: flex; gap: 14px; align-items: center; }
  .sheet .portrait > .portrait-cat, .sheet .portrait > .thumb { width: 130px; max-width: none; flex: none; }
  .sheet .he.big { font-size: 2.2rem; display: block; line-height: 1.2; }
  .sheet .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 12px; }
  .pick button {
    font: inherit; color: var(--ink); background: #F4F7EC; border: 2px solid var(--line); border-radius: 16px;
    padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
  }
  .pick button:hover { border-color: var(--ink); }
  .pick .thumb { max-width: 84px; }
  .muted { color: var(--muted); }

  /* Toasts */
  #toasts {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: max(12px, env(safe-area-inset-top)); z-index: 40;
    display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 440px);
  }
  .toast {
    background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 16px;
    font-weight: 500; text-align: center; animation: toast 3.8s ease forwards;
  }
  .toast .he { font-size: 1.15rem; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  .test { margin-top: 18px; padding: 12px 14px; border: 2px dashed #C9A0A0; border-radius: 16px; background: #FFF5F2; }
  .test .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* Motion. Calm on purpose: a slow breath for sleepers, a fade-in on arrival,
     a gentle rock for toys, and an occasional frame swap when extra frames exist. */
  .breathe { animation: breathe 5.5s ease-in-out infinite; transform-origin: 50% 97%; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012, 1.02); } }
  .cat-in { animation: catin 1.2s ease-out both; }
  @keyframes catin { from { opacity: 0; } }
  .wobble { transform-origin: 50% 92%; animation: wob 5s ease-in-out infinite; }
  @keyframes wob { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(1.5deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <h1 class="title"><span class="he" lang="he">הֶחָצֵר</span><span>The Yard</span></h1>
    <div class="wallet">
      <button id="giftBtn" class="btn" hidden></button>
      <div id="fish" class="fish" aria-live="polite">🐟 0</div>
    </div>
  </header>

  <div id="yard" class="yard">
    <div class="tint" id="tint" aria-hidden="true"></div>
    <div id="spots"></div>
  </div>
  <p class="hint" id="hint"></p>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="shop" aria-selected="true">Shop <span class="he" lang="he">חֲנוּת</span></button>
    <button class="tab" role="tab" data-tab="album" aria-selected="false">Cats <span class="he" lang="he">חֲתוּלִים</span></button>
  </div>
  <section id="shop" class="grid"></section>
  <section id="album" class="grid" hidden></section>

  <div class="earn">
    Earn fish by practicing: <a href="../hwg/">Word builder</a> and <a href="../hbt/">Interlinear practice</a>.
  </div>

  <section id="test" class="test" hidden>
    <strong>Testing tools</strong> <span class="muted">(only shown when the address ends in ?test)</span>
    <div class="row">
      <button class="btn plain" data-test="fish">Add 50 fish</button>
      <button class="btn plain" data-test="skip">Skip 30 minutes</button>
      <button class="btn plain" data-test="reset">Reset everything</button>
    </div>
  </section>
</main>

<div id="toasts" aria-live="polite"></div>
<div id="overlay" class="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function () {
  'use strict';

  /* ---------- Settings you can tweak ---------- */
  const ARRIVAL_MINUTES = 10;   // on average, how long until a cat finds an empty item
  const STAY_MIN = 20, STAY_MAX = 60; // how many minutes a cat stays
  const MAX_AWAY_HOURS = 24;    // time away is counted up to this many hours
  const TICK_MS = 15000;        // how often the yard checks for visitors while open
  const WELCOME_FISH = 10;      // fish given on the very first visit
  const FRAME_MS = 10000;       // how often a cat with extra frames (sleep-2.webp...) swaps to the next

  /* ---------- Shared storage keys ---------- */
  const FISH_KEY = 'fish';      // the shared wallet that hwg and hbt will add to
  const SAVE_KEY = 'yard-save-v1';

  /* ---------- Art ----------
     Cats:  cats/<cat>/{sit,sleep,lie}.webp, plus sleep-2.webp, sleep-3.webp...
            for extra frames that swap in slowly.
     Items: objects/<item>.webp, plus objects/<item>-front.webp for items with hasFront.
     Make every file with tools/process_art.py from yard/raw/.
     Until a file exists: a cat shows Tapuz as a stand-in, and an item shows its
     old SVG drawing (kept at the bottom of this script as a fallback). */
  const ART_OK = new Set();     // files that have loaded
  const artPath = {
    cat: (catId, pose, n) => `cats/${catId}/${n > 1 ? pose + '-' + n : pose}.webp`,
    item: (id) => `objects/${id}.webp`,
    front: (id) => `objects/${id}-front.webp`,
    combo: (catId, id) => `combos/${catId}/${id}.webp`   // a cat already on this object
  };

  /* ---------- Items ----------
     pose:     which cat pose sits on it (sit, sleep or lie).
     hasFront: the object has a front layer, drawn over the cat (box and basket).
     wobble:   the object gently rocks (toys).
     cat:      where the cat's feet go, as percentages of the object image
               (x from the left, y from the top). Every cat is drawn at the
               same size, so there is no per-item scale.
               Measured from the art: the cushion's top is y 74-97; the basket's
               inside is y 48-55 and its front y 55-97; the tent's doorway is
               centre-bottom. The box has no art yet, so its values are a guess. */
  const CAT_WIDTH = 100;        // a cat's image is the full spot width, at its natural size
  const ITEMS = {
    cushion: { he: 'כָּרִית', tr: 'karit', en: 'cushion', price: 100, pose: 'sleep', cat: { x: 50, y: 82 } },
    ball:    { he: 'כַּדּוּר', tr: 'kadur', en: 'ball', price: 120, pose: 'lie', wobble: true, cat: { x: 72, y: 95 } },
    box:     { he: 'קֻפְסָה', tr: 'kufsa', en: 'box', price: 150, pose: 'sit', hasFront: true, cat: { x: 50, y: 80 } },
    yarn:    { he: 'כַּדּוּר צֶמֶר', tr: 'kadur tsemer', en: 'ball of yarn', price: 200, pose: 'lie', wobble: true, cat: { x: 76, y: 95 } },
    basket:  { he: 'סַל', tr: 'sal', en: 'basket', price: 300, pose: 'sleep', hasFront: true, cat: { x: 50, y: 60 } },
    tent:    { he: 'אֹהֶל', tr: 'ohel', en: 'tent', price: 500, pose: 'sit', cat: { x: 50, y: 92 } }
  };
  const ITEM_ORDER = ['cushion', 'ball', 'box', 'yarn', 'basket', 'tent'];
  const POSE_LABEL = { sit: 'sitting', sleep: 'napping', lie: 'lying' };

  /* ---------- Cats ---------- */
  const CATS = {
    tapuz:  { he: 'תַּפּוּז', tr: 'Tapuz', en: 'orange', rarity: 1, likes: { cushion: 3, ball: 2 }, gift: [1, 3] },
    pilpel: { he: 'פִּלְפֵּל', tr: 'Pilpel', en: 'pepper', rarity: 1, likes: { box: 3, tent: 2 }, gift: [1, 3] },
    sheleg: { he: 'שֶׁלֶג', tr: 'Sheleg', en: 'snow', rarity: .8, likes: { basket: 3, cushion: 2 }, gift: [1, 3] },
    dvash:  { he: 'דְּבַשׁ', tr: 'Dvash', en: 'honey', rarity: .9, likes: { yarn: 3, ball: 2 }, gift: [1, 3] },
    shoko:  { he: 'שׁוֹקוֹ', tr: 'Shoko', en: 'chocolate milk', rarity: .9, likes: { ball: 3, box: 2 }, gift: [2, 3] },
    rimon:  { he: 'רִמּוֹן', tr: 'Rimon', en: 'pomegranate', rarity: .5, likes: { yarn: 2, basket: 2 }, gift: [3, 5] },
    kokhav: { he: 'כּוֹכָב', tr: 'Kokhav', en: 'star', rarity: .25, likes: { tent: 4 }, gift: [5, 8] }
  };
  const CAT_ORDER = ['tapuz', 'pilpel', 'sheleg', 'dvash', 'shoko', 'rimon', 'kokhav'];

  /* Spot positions in the yard: x = centre (%), y = bottom edge (%) */
  const SPOTS = [
    { x: 20, y: 58, back: true }, { x: 50, y: 54, back: true }, { x: 80, y: 58, back: true },
    { x: 21, y: 90 }, { x: 51, y: 94 }, { x: 80, y: 90 }
  ];

  /* ---------- Storage (falls back to memory if the browser blocks it) ---------- */
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return k in mem ? mem[k] : null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
    remove(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
  };
  function getFish() {
    const n = parseInt(store.get(FISH_KEY) || '0', 10);
    return Number.isFinite(n) && n > 0 ? n : 0;
  }
  function setFish(n) { store.set(FISH_KEY, String(Math.max(0, Math.floor(n)))); renderWallet(true); }

  function freshState() {
    return { owned: [], spots: [null, null, null, null, null, null], visitors: {}, gifts: 0, seen: {}, lastCheck: null, welcomed: false };
  }
  function load() {
    const s = freshState();
    try {
      const raw = store.get(SAVE_KEY);
      if (raw) Object.assign(s, JSON.parse(raw));
    } catch (e) { /* corrupted save: start fresh */ }
    while (s.spots.length < SPOTS.length) s.spots.push(null);
    return s;
  }
  let state = load();
  function save() { store.set(SAVE_KEY, JSON.stringify(state)); }

  /* ---------- Helpers ---------- */
  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const heSpan = (t) => `<span class="he" lang="he">${t}</span>`;

  /* ---------- Art: loading and lookup ---------- */
  function catFrames(catId, pose) {
    const own = [1, 2, 3].map((n) => artPath.cat(catId, pose, n)).filter((p) => ART_OK.has(p));
    return own.length ? own : [artPath.cat('tapuz', pose, 1)];   // stand-in until this cat has art
  }
  function itemLayers(id) {
    const it = ITEMS[id];
    const useArt = ART_OK.has(artPath.item(id)) && (!it.hasFront || ART_OK.has(artPath.front(id)));
    if (useArt) {
      return {
        back: `<img class="layer${it.wobble ? ' wobble' : ''}" src="${artPath.item(id)}" alt="">`,
        front: it.hasFront ? `<img class="layer" src="${artPath.front(id)}" alt="">` : ''
      };
    }
    // Same layering rule as the images: only hasFront items draw over the cat.
    const front = itemFront(id);
    const svg = (inner) => `<svg class="layer" viewBox="0 0 120 100" aria-hidden="true">${inner}</svg>`;
    return it.hasFront
      ? { back: svg(itemBack(id)), front: svg(front) }
      : { back: svg(itemBack(id) + front), front: '' };
  }
  function thumb(id) {
    const L = itemLayers(id);
    return `<div class="thumb">${L.back}${L.front}</div>`;
  }
  function catPortrait(catId, sil) {
    return `<div class="portrait-cat${sil ? ' sil' : ''}"><img src="${catFrames(catId, 'sit')[0]}" alt=""></div>`;
  }
  function catLayer(v, it) {
    const { x, y } = it.cat;
    const frames = catFrames(v.cat, it.pose);
    const imgs = frames.map((src, k) => `<img class="${k ? '' : 'on'}" src="${src}" alt="">`).join('');
    const motion = it.pose === 'sleep' ? ' breathe' : '';
    // The cat image's feet are at (50%, 97%) of its own box, so shift by that much.
    return `<div class="cat-layer${v.fresh ? ' cat-in' : ''}" style="left:${x - CAT_WIDTH * 0.5}%;top:${y - CAT_WIDTH * 0.97}%;width:${CAT_WIDTH}%">` +
      `<div class="frames${motion}">${imgs}</div></div>`;
  }

  /* Fetch every file once. Re-render as each one arrives. */
  let artQueued = false;
  function refreshArt() {
    if (artQueued) return;
    artQueued = true;
    setTimeout(() => { artQueued = false; renderYard(); renderShop(); renderAlbum(); }, 0);
  }
  function probe(paths, optional) {
    paths.forEach((p) => {
      const im = new Image();
      im.onload = () => { ART_OK.add(p); refreshArt(); };
      im.onerror = () => { if (!optional) console.info('No art yet: ' + p); };
      im.src = p;
    });
  }
  function probeAll() {
    const required = [], optional = [];
    Object.keys(CATS).forEach((c) => ['sit', 'sleep', 'lie'].forEach((p) => {
      required.push(artPath.cat(c, p, 1));
      [2, 3].forEach((n) => optional.push(artPath.cat(c, p, n)));
    }));
    Object.keys(ITEMS).forEach((id) => {
      required.push(artPath.item(id));
      if (ITEMS[id].hasFront) required.push(artPath.front(id));
      Object.keys(CATS).forEach((c) => optional.push(artPath.combo(c, id)));
    });
    probe(required, false);
    probe(optional, true);
  }

  /* Extra frames: every few seconds, each multi-frame cat swaps to its next frame. */
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setInterval(() => {
      document.querySelectorAll('.frames').forEach((f) => {
        const imgs = f.children;
        if (imgs.length < 2) return;
        const cur = [...imgs].findIndex((i) => i.classList.contains('on'));
        imgs[cur].classList.remove('on');
        imgs[(cur + 1) % imgs.length].classList.add('on');
      });
    }, FRAME_MS);
  }

  /* ---------- Visiting logic ---------- */
  function pickCat(itemId, present) {
    const pool = CAT_ORDER.filter((id) => !present.has(id)).map((id) => {
      const c = CATS[id];
      return { id, w: c.rarity * (c.likes[itemId] || 0.4) };
    });
    const total = pool.reduce((a, b) => a + b.w, 0);
    if (!total) return null;
    let r = Math.random() * total;
    for (const p of pool) { r -= p.w; if (r <= 0) return p.id; }
    return pool[pool.length - 1].id;
  }

  function simulate(now) {
    const ev = { arrived: [], changed: false, span: 0 };
    if (state.lastCheck == null) { state.lastCheck = now; ev.changed = true; return ev; }
    const span = Math.max(0, Math.min(now - state.lastCheck, MAX_AWAY_HOURS * 3600e3));
    const start = now - span;
    ev.span = span;

    // Cats whose time is up leave a gift.
    Object.keys(state.visitors).forEach((k) => {
      const v = state.visitors[k];
      if (now >= v.leave || !state.spots[k]) {
        state.gifts += v.gift;
        delete state.visitors[k];
        ev.changed = true;
      }
    });

    // Empty items may attract a new cat.
    const present = new Set(Object.values(state.visitors).map((v) => v.cat));
    if (span > 0) {
      state.spots.forEach((itemId, i) => {
        if (!itemId || state.visitors[i]) return;
        const p = 1 - Math.exp(-span / (ARRIVAL_MINUTES * 60e3));
        if (Math.random() >= p) return;
        const cat = pickCat(itemId, present);
        if (!cat) return;
        present.add(cat);
        const arrive = start + Math.random() * span;
        const leave = arrive + rand(STAY_MIN, STAY_MAX) * 60e3;
        const gift = randInt(CATS[cat].gift[0], CATS[cat].gift[1]);
        state.seen[cat] = (state.seen[cat] || 0) + 1;
        ev.arrived.push(cat);
        ev.changed = true;
        if (leave <= now) state.gifts += gift;            // came and went while you were away
        else state.visitors[i] = { cat, arrive, leave, gift, fresh: true };
      });
    }
    state.lastCheck = now;
    return ev;
  }

  function tick(summary) {
    const ev = simulate(Date.now());
    if (ev.changed) { save(); renderYard(); renderAlbum(); renderWallet(); }
    if (!ev.arrived.length) return;
    if (summary && ev.span > 60e3) {
      const n = ev.arrived.length;
      toast(`While you were away, ${n} cat${n > 1 ? 's' : ''} visited.`);
    } else {
      ev.arrived.forEach((id) => toast(`${heSpan(CATS[id].he)} ${CATS[id].tr} came to visit!`));
    }
  }

  /* ---------- Rendering ---------- */
  function renderWallet(bump) {
    const el = $('fish');
    el.textContent = '🐟 ' + getFish();
    if (bump) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 220); }
    const g = $('giftBtn');
    g.hidden = !state.gifts;
    g.textContent = `🎁 Collect ${state.gifts}`;
    renderShop();
    renderHint();
  }

  function renderHint() {
    const placed = state.spots.some(Boolean);
    const unplaced = state.owned.filter((id) => !state.spots.includes(id));
    let t;
    if (!state.owned.length) t = 'Buy something from the shop below, then tap a spot in the yard to put it out.';
    else if (unplaced.length) t = 'Tap an empty spot in the yard to put out what you bought.';
    else if (placed && !Object.keys(state.visitors).length) t = 'Cats wander in over time. Go practice and check back later.';
    else t = 'Tap a cat to meet it. Cats leave fish as a thank-you when they go.';
    $('hint').textContent = t;
  }

  function renderYard() {
    $('spots').innerHTML = SPOTS.map((p, i) => {
      const itemId = state.spots[i], v = state.visitors[i];
      let inner, label;
      if (!itemId) {
        inner = `<svg class="layer" viewBox="0 0 120 100" aria-hidden="true"><g class="empty-mark"><ellipse cx="60" cy="90" rx="30" ry="8" fill="rgba(255,255,255,.22)" stroke="#fff" stroke-width="2" stroke-dasharray="5 5"/>` +
          `<path d="M60 84 V96 M54 90 H66" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g></svg>`;
        label = 'Empty spot. Put out an item.';
      } else {
        const it = ITEMS[itemId], L = itemLayers(itemId);
        const combo = v && ART_OK.has(artPath.combo(v.cat, itemId)) ? artPath.combo(v.cat, itemId) : null;
        if (combo) {
          // One image with the cat already on the object: the best fit, so use it alone.
          inner = `<img class="layer${v.fresh ? ' cat-in' : ''}" src="${combo}" alt="">`;
        } else {
          inner = L.back;                               // object, back
          if (v) inner += catLayer(v, it);              // cat, between the two layers
          inner += L.front;                             // object, front (box and basket)
        }
        label = v ? `${CATS[v.cat].tr} ${POSE_LABEL[it.pose]} on the ${it.en}` : `${it.tr} (${it.en})`;
        if (v) v.fresh = false;
      }
      return `<button class="spot${p.back ? ' back' : ''}" data-i="${i}" aria-label="${label}" style="left:${p.x}%;bottom:${100 - p.y}%;z-index:${p.y}">${inner}</button>`;
    }).join('');
    renderHint();
  }

  function renderShop() {
    const fish = getFish();
    $('shop').innerHTML = ITEM_ORDER.map((id) => {
      const it = ITEMS[id];
      const owned = state.owned.includes(id);
      const action = owned
        ? `<div class="tag">${state.spots.includes(id) ? 'In your yard' : 'Owned'}</div>`
        : `<button class="btn" data-buy="${id}" ${fish < it.price ? 'disabled' : ''}>Buy for ${it.price} 🐟</button>`;
      return `<div class="card">${thumb(id)}${heSpan(it.he)}<div class="tr">${it.tr}</div><div class="en">${it.en}</div>${action}</div>`;
    }).join('');
  }

  function renderAlbum() {
    $('album').innerHTML = CAT_ORDER.map((id) => {
      const c = CATS[id], n = state.seen[id] || 0;
      if (!n) return `<div class="card">${catPortrait(id, true)}<div class="he">?</div><div class="tr">Not met yet</div><div class="en">&nbsp;</div></div>`;
      const fav = Object.keys(c.likes).sort((a, b) => c.likes[b] - c.likes[a])[0];
      return `<div class="card">${catPortrait(id)}${heSpan(c.he)}<div class="tr">${c.tr}</div><div class="en">“${c.en}”</div>` +
        `<div class="muted" style="font-size:.88rem">Visits: ${n}<br>Loves the ${heSpan(ITEMS[fav].he)}</div></div>`;
    }).join('');
  }

  /* ---------- Sheet (bottom panel) ---------- */
  let sheetSpot = null;
  function openSheet(html) {
    $('sheet').innerHTML = html;
    $('overlay').hidden = false;
    const first = $('sheet').querySelector('button');
    if (first) first.focus();
  }
  function closeSheet() { $('overlay').hidden = true; sheetSpot = null; }

  function openSpot(i) {
    sheetSpot = i;
    const itemId = state.spots[i], v = state.visitors[i];
    if (v) {
      const c = CATS[v.cat], it = ITEMS[itemId];
      const mins = Math.max(1, Math.round((v.leave - Date.now()) / 60e3));
      const doing = POSE_LABEL[it.pose];
      openSheet(`<div class="portrait">${catPortrait(v.cat)}<div>
          <span class="he big" lang="he">${c.he}</span>
          <h2>${c.tr}</h2><div class="muted">“${c.en}”</div>
          <p>${doing[0].toUpperCase() + doing.slice(1)} on the ${heSpan(it.he)} (${it.tr}). Staying about ${mins} more minute${mins > 1 ? 's' : ''}.</p>
        </div></div>
        <div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
    } else if (itemId) {
      const it = ITEMS[itemId];
      openSheet(`<div class="portrait">${thumb(itemId)}<div>
          <span class="he big" lang="he">${it.he}</span><h2>${it.tr}</h2><div class="muted">${it.en}</div>
          <p>No one here yet. Cats find items on their own.</p></div></div>
        <div class="row"><button class="btn plain" data-act="remove">Put it away</button><button class="btn" data-act="close">Close</button></div>`);
    } else {
      const free = state.owned.filter((id) => !state.spots.includes(id));
      const body = free.length
        ? `<div class="pick">${free.map((id) => `<button data-place="${id}">${thumb(id)}${heSpan(ITEMS[id].he)}<span>${ITEMS[id].tr}</span></button>`).join('')}</div>`
        : `<p class="muted">${state.owned.length ? 'Everything you own is already out in the yard.' : 'You don’t own any items yet.'} Buy one in the shop below.</p>`;
      openSheet(`<h2>Put out an item</h2>${body}<div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
    }
  }

  /* ---------- Toasts ---------- */
  function toast(html) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = html;
    $('toasts').appendChild(t);
    setTimeout(() => t.remove(), 3900);
  }

  /* ---------- Events ---------- */
  $('spots').addEventListener('click', (e) => {
    const b = e.target.closest('.spot');
    if (b) openSpot(+b.dataset.i);
  });

  $('sheet').addEventListener('click', (e) => {
    const place = e.target.closest('[data-place]');
    const act = e.target.closest('[data-act]');
    if (place && sheetSpot != null) {
      state.spots[sheetSpot] = place.dataset.place;
      save(); closeSheet(); renderYard(); renderShop();
    } else if (act && act.dataset.act === 'remove' && sheetSpot != null) {
      state.spots[sheetSpot] = null;
      save(); closeSheet(); renderYard(); renderShop();
    } else if (act) {
      closeSheet();
    }
  });
  $('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('overlay').hidden) closeSheet(); });

  $('shop').addEventListener('click', (e) => {
    const b = e.target.closest('[data-buy]');
    if (!b) return;
    const id = b.dataset.buy, it = ITEMS[id], fish = getFish();
    if (state.owned.includes(id) || fish < it.price) return;
    state.owned.push(id);
    save();
    setFish(fish - it.price);
    toast(`Bought ${heSpan(it.he)} ${it.tr}! Tap a spot in the yard to put it out.`);
  });

  $('giftBtn').addEventListener('click', () => {
    const n = state.gifts;
    if (!n) return;
    state.gifts = 0;
    save();
    setFish(getFish() + n);
    toast(`Collected ${n} 🐟 from your visitors.`);
  });

  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', x === t ? 'true' : 'false'));
    $('shop').hidden = t.dataset.tab !== 'shop';
    $('album').hidden = t.dataset.tab !== 'album';
  }));

  // If hwg or hbt adds fish in another tab, update the count here.
  window.addEventListener('storage', (e) => { if (e.key === FISH_KEY) renderWallet(true); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { applyTimeOfDay(); renderWallet(); tick(true); } });

  /* ---------- Testing tools (visit /yard/?test) ---------- */
  if (/[?&]test\b/.test(location.search)) {
    $('test').hidden = false;
    $('test').addEventListener('click', (e) => {
      const b = e.target.closest('[data-test]');
      if (!b) return;
      if (b.dataset.test === 'fish') setFish(getFish() + 50);
      if (b.dataset.test === 'skip') {
        const ms = 30 * 60e3;
        if (state.lastCheck != null) state.lastCheck -= ms;
        Object.values(state.visitors).forEach((v) => { v.arrive -= ms; v.leave -= ms; });
        tick(true);
      }
      if (b.dataset.test === 'reset' && confirm('Erase your yard, cats, and fish?')) {
        store.remove(SAVE_KEY); store.remove(FISH_KEY);
        state = freshState(); start();
      }
    });
  }

  /* ============================================================
     Scene and item drawing. The sky, hill, fence and grass are SVG.
     The item drawings below are FALLBACKS only: each one is used until
     its image file exists. Delete an item's drawing once its art is done.
     ============================================================ */
  const OUT = '#4A3B32';

  function itemBack(id) {
    let s = `<ellipse cx="60" cy="98" rx="46" ry="4.5" fill="rgba(40,60,20,.18)"/>`;
    if (id === 'cushion') {
      s += `<rect x="14" y="80" width="92" height="18" rx="9" fill="#EE93A3" stroke="${OUT}" stroke-width="2.5"/>`;
      s += `<path d="M22 85 Q60 79 98 85" stroke="#F7B9C4" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      s += `<g fill="#C9657A"><circle cx="40" cy="91" r="1.8"/><circle cx="60" cy="92" r="1.8"/><circle cx="80" cy="91" r="1.8"/></g>`;
    } else if (id === 'basket') {
      s += `<ellipse cx="60" cy="74" rx="46" ry="8" fill="#8B5A2B" stroke="${OUT}" stroke-width="2.5"/>`;
    } else if (id === 'box') {
      s += `<path d="M24 64 L32 52 L88 52 L96 64 Z" fill="#9E6B3A" stroke="${OUT}" stroke-width="2.5" stroke-linejoin="round"/>`;
    } else if (id === 'tent') {
      s += `<path d="M60 16 L60 9" stroke="${OUT}" stroke-width="2"/><path d="M60 9 L71 12.5 L60 16 Z" fill="#F2C14E" stroke="${OUT}" stroke-width="1.2" stroke-linejoin="round"/>`;
      s += `<path d="M8 98 L60 16 L112 98 Z" fill="#8DC0B4" stroke="${OUT}" stroke-width="2.5" stroke-linejoin="round"/>`;
      s += `<path d="M36 98 L60 50 L84 98 Z" fill="#3E625B"/>`;
      s += `<path d="M60 18 L60 50" stroke="#6FA396" stroke-width="2"/>`;
    }
    return s;
  }
  function itemFront(id) {
    if (id === 'basket') {
      return `<path d="M14 74 Q60 86 106 74 L98 97 Q60 101 22 97 Z" fill="#C98B4E" stroke="${OUT}" stroke-width="2.5" stroke-linejoin="round"/>` +
        `<g stroke="#9C6531" stroke-width="1.6" fill="none"><path d="M19 84 Q60 94 101 84"/><path d="M22 91 Q60 100 98 91"/><path d="M40 81 L38 98"/><path d="M60 83 L60 99"/><path d="M80 81 L82 98"/></g>`;
    }
    if (id === 'box') {
      return `<path d="M24 64 L8 57 L13 50 L30 58 Z" fill="#C88F50" stroke="${OUT}" stroke-width="2.5" stroke-linejoin="round"/>` +
        `<path d="M96 64 L112 57 L107 50 L90 58 Z" fill="#C88F50" stroke="${OUT}" stroke-width="2.5" stroke-linejoin="round"/>` +
        `<rect x="24" y="64" width="72" height="34" rx="2" fill="#D9A465" stroke="${OUT}" stroke-width="2.5"/>` +
        `<rect x="52" y="65.5" width="16" height="10" fill="#EBD3A8" opacity=".85"/>`;
    }
    if (id === 'yarn') {
      return `<g class="wobble"><path d="M88 94 Q70 100 52 97" fill="none" stroke="#6E98CF" stroke-width="2" stroke-linecap="round"/>` +
        `<circle cx="99" cy="87" r="11" fill="#86AEE0" stroke="${OUT}" stroke-width="2.5"/>` +
        `<path d="M90 82 Q99 88 107 80 M89 89 Q99 95 109 88 M95 77 Q100 88 96 97" fill="none" stroke="#5E88C2" stroke-width="1.6"/></g>`;
    }
    if (id === 'ball') {
      return `<g class="wobble"><circle cx="100" cy="89" r="9" fill="#E9705F" stroke="${OUT}" stroke-width="2.5"/>` +
        `<path d="M91.5 86 Q100 91 108.5 86" fill="none" stroke="#FFF5E8" stroke-width="3"/></g>`;
    }
    return '';
  }

  /* ---------- Time of day ----------
     The garden is one daytime image. Evening and night are colour washes over it. */
  const TINTS = {
    day:     'transparent',
    evening: 'linear-gradient(rgba(242,150,110,.28), rgba(242,150,110,.10))',
    night:   'linear-gradient(rgba(30,40,85,.55), rgba(30,40,85,.40))'
  };
  function applyTimeOfDay() {
    const h = new Date().getHours();
    const key = (h >= 7 && h < 17) ? 'day' : ((h >= 17 && h < 20) || (h >= 5 && h < 7)) ? 'evening' : 'night';
    $('tint').style.background = TINTS[key];
  }

  /* ---------- Start ---------- */
  function start() {
    if (!state.welcomed) {
      state.welcomed = true;
      save();
      setFish(getFish() + WELCOME_FISH);
      toast(`Welcome to your yard! Here are ${WELCOME_FISH} 🐟 to start.`);
    }
    applyTimeOfDay();
    renderYard();
    renderAlbum();
    renderWallet();
    tick(true);
  }
  probeAll();
  start();
  setInterval(() => { applyTimeOfDay(); tick(false); }, TICK_MS);
})();
</script>
</body>
</html>
