<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neko Ryokan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFEF6;
    --ink: #3F3530;
    --muted: #7C6F63;
    --line: #D3DCC0;
    --sun: #F6B93B;
    --pond: #4F86B5;
    --leaf: #5E8F4A;
    /* One room is a 9:16 portrait panel: full width on a phone, a centred strip on a desktop. */
    --W: calc(100dvh * 0.5625);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #2B221C; color: var(--ink);
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-size: 17px; line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
    /* Dragging across the game shouldn't select/highlight art or text like a page of prose. */
    user-select: none; -webkit-user-select: none;
  }
  img { -webkit-user-drag: none; user-drag: none; }
  /* Japanese text: room, item and cat names. */
  .ja { font-family: "Zen Maru Gothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; font-weight: 700; }

  /* ---------- The world: four rooms side by side, swipe to move ---------- */
  /* The rooms are placed around the centre of the screen. The current room is in the middle, and its neighbours
     are either side. The rooms run in a line, so the first and last rooms have no neighbour beyond them. */
  #world { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; }
  .room {
    position: absolute; top: 0; left: 50%; width: var(--W); height: 100dvh; overflow: hidden;
    transition: transform .35s cubic-bezier(.2, .8, .2, 1);
  }
  .room:not(.current) { pointer-events: none; }
  /* The stage is the art. It covers the room (so a tall phone crops the sides a little)
     and every spot is placed in percentages of it, so items stay glued to the picture. */
  .stage {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    height: max(100dvh, calc(var(--W) * 1.7778)); aspect-ratio: 9 / 16;
    container-type: size;   /* lets children offset by a share of the picture (cqw, cqh) */
  }
  .bg { position: absolute; inset: 0; background-color: #9DCC6E; background-repeat: no-repeat; background-size: auto 100%; }
  /* The picture is six rooms wide: a margin, the four rooms, and a margin (scene/ryokan-pano*.webp).
     Each section shows one slice of it, --slice from 0 to 5. The stage is one room wide and the picture is six
     stages wide, so the slice's left edge is at --slice stages and background-position is --slice / 5.
     --pano (the file for the current season) is set once on :root by applyPano(), see PANO_SEASONS. */
  .bg { background-image: var(--pano, url("scene/ryokan-pano.webp")); background-size: auto 100%; background-position: calc(var(--slice) * 20%) 50%; }
  .tint { position: absolute; inset: 0; pointer-events: none; transition: background 1.5s ease; }
  .seam { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }

  .spot {
    position: absolute; width: 42%; aspect-ratio: 120 / 100; transform: translateX(-50%);
    padding: 0; border: 0; background: none; cursor: pointer; border-radius: 14px;
  }
  .spot .empty-mark { opacity: .75; transition: opacity .2s; }
  .spot:hover .empty-mark { opacity: 1; }
  .spot:focus-visible, .btn:focus-visible, .dot:focus-visible, .nav:focus-visible { outline: 3px solid var(--pond); outline-offset: 3px; }

  /* Art: every object and cat image is a 480 x 400 canvas, the spot's shape. */
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .thumb { position: relative; width: 100%; max-width: 136px; aspect-ratio: 6 / 5; }
  /* Shop/bag/portrait-only resize or recentring for an item whose canvas looks right in its room
     spot but not in this plain square icon (see thumb()'s use of it.thumbScale/thumbShift). The
     transform (any value other than none) makes this div the containing block for its absolutely
     positioned .layer child, so that child's inset:0 still fills exactly this box. */
  .thumb-fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cat-layer { position: absolute; pointer-events: none; }
  .cat-layer img { display: block; width: 100%; height: auto; }
  .portrait-cat { width: 100%; max-width: 136px; }
  .portrait-cat img { display: block; width: 100%; height: auto; }
  .sil img { filter: brightness(0); opacity: .18; }
  .breathe { animation: breathe 5.5s ease-in-out infinite; transform-origin: 50% 97%; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012, 1.02); } }
  .cat-in { animation: catin 1.2s ease-out both; }
  @keyframes catin { from { opacity: 0; } }
  /* Ground-contact shadow: code-drawn, not baked into the art (the item prompt spec explicitly
     excludes cast shadows for this reason -- see ART-PROMPTS-ROOMS.md / ART-PERSPECTIVE-SPEC.md).
     Items only, not cats -- a cat is always sitting on, in, or behind an item (never bare floor),
     so the item's own shadow already grounds the pair; a second shadow under the cat was both
     redundant and, for a pose whose art sits close to its own baseline (e.g. the "head" peeking
     pose), visually overlapped the cat itself. Every item shares one 480x400 canvas with the same
     baseline (process_art.py's BASELINE_PAD), so one ellipse, in the same 120x100 viewBox the
     empty-mark ovals already use, sits at the right spot under all of them with no per-item
     tuning. Warm brown, not black, multiply-blended so the floor's own colour and grain show
     through. Skewed and shifted toward the lower-left, away from the rooms' shared upper-right
     light (ART-PROMPTS-ROOMS.md).
     Strength: measured the panorama's own painted window-shadows directly (a lit floor patch vs
     a shadow-stripe patch in shokudo) at luminance ratio ~0.90, i.e. the art's own shadows only
     darken the floor by about 10%. The values below are tuned to roughly that same softness at
     the ellipse's own centre, not the much harder ~70% darkening an untuned multiply/opacity
     combination gives by default.
  */
  .shadow { fill: #6B4226; filter: blur(.12cqw); mix-blend-mode: multiply; opacity: .22; transform: translateX(-3%) skewX(-10deg); transform-origin: 54% 90%; }
  /* Floor type changes how the shadow reads: glossy wood (shokudo, engawa) keeps it softest and
     faintest since the shiny floor scatters the contact point; matte tatami (zashiki) keeps it
     closest to full strength; damp stone (onsen) sits in between. */
  .r-zashiki .shadow { opacity: .3; }
  .r-shokudo .shadow, .r-engawa .shadow { opacity: .15; filter: blur(.2cqw); }
  .r-onsen .shadow { opacity: .22; }

  /* Reflection: shokudo's floor is the most polished of the four ("soft reflections of window
     light" in ART-PROMPTS-ROOMS.md), so its items get a faint flipped echo of themselves that
     fades out going down, the same cheap trick as a rained-on street. Items only, not cats --
     a cat's own silhouette varies by pose too much for one flat mask to read well. */
  .r-shokudo .spot .reflection {
    position: absolute; left: 0; top: 100%; width: 100%; height: 58%; transform: scaleY(-1); transform-origin: top;
    opacity: .2; pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,0) 72%);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,.85), rgba(0,0,0,0) 72%);
  }
  .wobble { transform-origin: 50% 92%; animation: wob 5s ease-in-out infinite; }
  /* Kazaguruma: the wheel is a separate free-floating layer (objects/kazaguruma-wheel.webp, see
     FLOATING in process_art.py), positioned at the stand's stick tip by its own x/y/w like a bath's
     water. The wrap only centres the layer horizontally; the img inside spins around the hub
     (transform-origin set inline, measured on the raw art -- see ITEMS.kazaguruma.wheel), kept
     separate so the rotate and the translateX(-50%) centring don't fight over one transform. */
  .kazaguruma-wheel-wrap { position: absolute; transform: translateX(-50%); pointer-events: none; }
  .kazaguruma-wheel-wrap img { display: block; width: 100%; height: auto; }
  /* Only spins when placed in a room (inSpot) -- the shop/bag thumbnail shows it still, matching
     every other item's thumbnail (no wobble, no water shimmer there either). */
  .kazaguruma-wheel-wrap.spin img { animation: spin 2.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Carp streamer fish (see itemLayers' `fish`): left/top/width already place its top-left corner
     directly (measured against the pole in the shared raw canvas before the two were split), so
     unlike the wheel above it needs no translateX(-50%) centring. */
  .koinobori-fish-wrap { position: absolute; pointer-events: none; }
  .koinobori-fish-wrap img { display: block; width: 100%; height: auto; }
  .koinobori-fish-wrap.sway img { animation: koi-sway 3.6s ease-in-out infinite; }
  /* Gym charms (see itemLayers' `charms`): same wind-gust sway as the koinobori fish, reused since a
     hanging tassel charm moves the same way a windsock does. Duration/delay come in per-charm inline
     (see ITEMS.gym.charms) so the three don't swing in lockstep. */
  .gym-charm-wrap { position: absolute; pointer-events: none; }
  .gym-charm-wrap img { display: block; width: 100%; height: auto; }
  .gym-charm-wrap.sway img { animation-name: koi-sway; animation-timing-function: ease-in-out; animation-iteration-count: infinite; }
  .water { position: absolute; transform: translateX(-50%); pointer-events: none; animation: shimmer 4s ease-in-out infinite; will-change: transform, opacity; }
  @keyframes shimmer { 0%, 100% { opacity: .8; transform: translateX(-50%); } 50% { opacity: 1; transform: translateX(calc(-50% + 1.5%)); } }
  /* The box's bottom sits on the water line (its own top offset, read as a bottom offset) and it rises above the rim. */
  /* isolation scopes the screen blend to just this box, so Safari doesn't mis-composite the rest of the bath around it. */
  .steam { position: absolute; width: var(--sw); left: var(--sx); bottom: calc(100% - var(--sy)); height: 34%; transform: translateX(-50%); pointer-events: none; isolation: isolate; }
  .steam .puff {
    position: absolute; bottom: 0; width: 50%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 70%);
    filter: blur(2px); opacity: 0; mix-blend-mode: screen; animation: steam-rise linear infinite;
    will-change: transform, opacity;
  }
  @keyframes steam-rise {
    0% { transform: translateY(0) scale(.7); opacity: 0; }
    18% { opacity: .62; }
    70% { opacity: .22; }
    100% { transform: translateY(-170%) scale(1.3); opacity: 0; }
  }
  /* --wob-deg lets a specific item rock further than the 1.5deg default (see ITEMS' wobbleDeg,
     e.g. the temari ball, which otherwise barely reads as moving at its 0.5x in-room scale). */
  @keyframes wob { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(var(--wob-deg, 1.5deg)); } }
  /* Tail swish (see CAT_TAILS): the tail is its own image, the same 480x400 canvas as its pose (see
     process_cat_tail in process_art.py), stacked exactly over the body with inset:0 so no extra
     positioning is needed here -- only a rotation around the base, where it meets the body. */
  .cat-layer .tail-sway { position: absolute; inset: 0; width: 100%; height: 100%; animation: tail-swish 3.2s ease-in-out infinite; }
  @keyframes tail-swish {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(6deg); }
  }
  /* Carp streamer fish: rocks side to side in the wind, not spinning like the pinwheel -- see
     itemLayers' `fish`. Asymmetric amplitude (further one way than the other) and the extra
     keyframe stops read as wind gusts rather than a metronome. */
  @keyframes koi-sway {
    0%   { transform: rotate(-4deg); }
    30%  { transform: rotate(7deg); }
    55%  { transform: rotate(2deg); }
    80%  { transform: rotate(6deg); }
    100% { transform: rotate(-4deg); }
  }

  /* Falling leaves: clipped to each room's window/outside view (WEATHER_ZONES in index.html's
     script, measured against raw/scene/ryokan-pano.png), so they drift past glass or open air,
     never across the room's own floor. The clip-path is set inline per room from the same
     rectangle the leaf spawn positions use, so there's one source of truth for "where outside is". */
  .weather { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  /* Two nested elements split sway (horizontal) from fall (vertical + rotate) -- same reason the
     kazaguruma wheel gets its own wrap: one transform per element, so centering/sway/spin never fight. */
  .leaf-sway { position: absolute; animation: leaf-sway ease-in-out infinite; }
  .leaf { display: block; width: 7.7px; height: 7.7px; border-radius: 0 60% 0 60%; opacity: 0; animation: leaf-fall linear infinite; }
  .leaf-0 { background: #C97A3D; } .leaf-1 { background: #A8432F; } .leaf-2 { background: #D9A441; }
  /* Same fall/sway motion, reskinned per season (data-weather, set on <html> by applyPano() from
     PANO_SEASONS). A higher-specificity attribute selector always wins over the plain .leaf-N
     colours above regardless of source order, so there's no cascade ordering to get wrong here. */
  :root[data-weather="sakura"] .leaf { width: 6.3px; height: 6.3px; border-radius: 50% 0 50% 50%; }
  :root[data-weather="sakura"] .leaf-0 { background: #F6C9D9; }
  :root[data-weather="sakura"] .leaf-1 { background: #F2A9C4; }
  :root[data-weather="sakura"] .leaf-2 { background: #FBE1EA; }
  /* A circle's own rotation is invisible, so snow reuses leaf-fall's rotate for free -- no separate
     keyframes needed. A flat white disc read as a hard dot, not snow -- a radial-gradient fading to
     transparent at the edge gives it a soft, fluffy silhouette instead of a crisp circle, and varying
     size/blur across the three leaf-N variants (reused as "near/mid/far" here, not 3 leaf shapes)
     adds a little depth, the same way real falling snow isn't all one size. */
  :root[data-weather="snow"] .leaf { border-radius: 50%; }
  :root[data-weather="snow"] .leaf-0 { width: 4.2px; height: 4.2px; background: radial-gradient(circle, #fff 0%, rgba(255,255,255,.85) 60%, rgba(255,255,255,0) 100%); }
  :root[data-weather="snow"] .leaf-1 { width: 6.3px; height: 6.3px; background: radial-gradient(circle, #fff 0%, rgba(255,255,255,.8) 55%, rgba(255,255,255,0) 100%); filter: blur(.3px); }
  :root[data-weather="snow"] .leaf-2 { width: 9.1px; height: 9.1px; background: radial-gradient(circle, #fff 0%, rgba(255,255,255,.75) 50%, rgba(255,255,255,0) 100%); filter: blur(.6px); }
  @keyframes leaf-sway { 0%, 100% { transform: translateX(calc(-50% - 6px)); } 50% { transform: translateX(calc(-50% + 6px)); } }
  /* --fall (cqh, set per leaf) is the zone's own height in % of the stage, so the same keyframe
     works for every room's differently-sized zone without a bespoke animation per room. */
  @keyframes leaf-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: .85; }
    85% { opacity: .85; }
    100% { transform: translateY(var(--fall)) rotate(540deg); opacity: 0; }
  }

  /* ---------- HUD, floating over the world ---------- */
  /* The HUD is pinned to the screen edges, not to the picture: fish top left, room name top centre, gift top right. */
  .hud { position: fixed; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  #hudTop { top: max(10px, env(safe-area-inset-top)); display: grid; grid-template-columns: 1fr auto 1fr; }
  #hudTop #fish { justify-self: start; }
  #hudTop #giftBtn { justify-self: end; }
  #hudTop #tripBtn { grid-column: 1; grid-row: 2; justify-self: start; margin-top: 6px; }
  .pill {
    background: rgba(255, 254, 246, .92); border: 2.5px solid var(--ink); border-radius: 999px;
    padding: 4px 14px; font-weight: 600; backdrop-filter: blur(4px);
  }
  .fish { background: var(--pond); color: #fff; min-width: 76px; text-align: center; transition: transform .2s; }
  .fish.bump { transform: scale(1.15); }
  #roomName { text-align: center; line-height: 1.15; padding: 3px 16px; }
  #roomName .ja { display: block; font-size: 1.35rem; color: var(--leaf); }
  #roomName small { color: var(--muted); font-weight: 500; font-size: .78rem; }
  .btn {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--sun);
    border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer; box-shadow: 0 3px 0 var(--ink);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { background: #E6E1D6; color: var(--muted); cursor: default; box-shadow: 0 3px 0 #B8AFA2; border-color: #B8AFA2; }
  .btn.plain { background: var(--paper); }

  #hudBottom { bottom: max(12px, env(safe-area-inset-bottom)); justify-content: center; flex-direction: column; gap: 8px; }
  .dots { display: flex; gap: 6px; }
  .dot {
    font: inherit; color: var(--ink); cursor: pointer; border: 2.5px solid var(--ink); border-radius: 999px;
    background: rgba(255, 254, 246, .75); padding: 2px 12px; font-size: .85rem; font-weight: 600; line-height: 1.5;
  }
  .dot .ja { font-size: 1rem; }
  .dot[aria-current="true"] { background: var(--sun); }
  .dock { display: flex; gap: 10px; }
  .nav {
    position: fixed; top: 50%; z-index: 10; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%;
    border: 2.5px solid var(--ink); background: rgba(255, 254, 246, .9); font-size: 1.4rem; cursor: pointer; display: none; color: var(--ink);
  }
  .nav.l { left: 10px; } .nav.r { right: 10px; }
  @media (hover: hover) and (min-width: 700px) { .nav { display: block; } }
  .nav:disabled { opacity: .3; cursor: default; }

  /* ---------- Sheets ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(40, 33, 28, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
  .sheet {
    background: var(--paper); width: 100%; max-width: 520px; max-height: 82dvh; overflow-y: auto; border: 3px solid var(--ink); border-bottom: 0;
    border-radius: 26px 26px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .25s ease-out;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 { margin: 0 0 4px; font-weight: 600; font-size: 1.25rem; }
  .sheet .portrait { display: flex; gap: 14px; align-items: center; }
  .sheet .portrait > .portrait-cat, .sheet .portrait > .thumb { width: 120px; max-width: none; flex: none; }
  .sheet .ja.big { font-size: 2.1rem; display: block; line-height: 1.2; }
  .sheet { position: relative; }
  .sheet-x { position: absolute; top: 12px; right: 12px; padding: 2px 12px; font-size: 1.1rem; line-height: 1.2; }
  .shop-head h2 { text-align: center; padding-right: 44px; }
  .shop-room { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 6px; }
  .shop-room .btn, .shop-body .btn { padding: 2px 12px; font-size: 1.3rem; line-height: 1.2; flex: none; }
  .shop-body { display: flex; align-items: center; gap: 8px; }
  .shop-body .grid { flex: 1; min-width: 0; grid-template-columns: repeat(2, 1fr); margin-top: 4px; }
  .zoom-frame { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .zoom-frame .btn { padding: 2px 12px; font-size: 1.3rem; line-height: 1.2; flex: none; }
  .zoom-frame .polaroid { min-width: 0; margin: 10px 0; }
  /* Empty slots keep a short last page the same height as a full one. */
  .card.ghost { visibility: hidden; }
  .bag-room { margin: 14px 0 2px; font-size: 1rem; }
  .bag-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .bag-item .thumb { width: 64px; flex: none; }
  .bag-item > div:nth-child(2) { flex: 1; }
  .sheet .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .pick, .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
  .pick button { font: inherit; color: var(--ink); background: #F4F7EC; border: 2px solid var(--line); border-radius: 16px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .pick .thumb { max-width: 84px; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 8px 8px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  button.card { font: inherit; color: var(--ink); cursor: pointer; }
  .card .ja { font-size: 1.45rem; line-height: 1.3; }
  .card .en { color: var(--muted); font-size: .88rem; line-height: 1.25; min-height: 2.5em; margin-bottom: 8px; }
  .card .btn { margin-top: auto; padding: 4px 12px; font-size: .95rem; }
  .tag { margin-top: auto; font-weight: 600; color: var(--leaf); padding: 5px 0; }
  .polaroid { width: 100%; max-width: 360px; margin: 10px auto; background: #fff; border-radius: 4px;
    padding: 14px 14px 36px; box-shadow: 0 4px 14px rgba(0,0,0,.18); transform: rotate(-1.5deg); }
  .polaroid .photo { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 1px; }
  .polaroid .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .polaroid .selfie { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
  .polaroid .photo.unknown { display: flex; align-items: center; justify-content: center; background: #E4E4E0; color: var(--muted); font-size: 2.6rem; font-weight: 600; }
  .polaroid.mini { max-width: none; padding: 7px 7px 20px; }
  .polaroid.mini .caption { font-size: .72rem; text-align: center; margin-top: 4px; color: var(--muted); }
  .book-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .book-chip { position: relative; border: 2px solid var(--line); border-radius: 50%; width: 52px; height: 52px; padding: 0; overflow: hidden; cursor: pointer; background: #fff; flex: none; }
  .book-chip img { width: 100%; height: 100%; object-fit: cover; }
  .book-chip.dest { border-radius: 10px; }
  /* Ticket art (see ticketThumb/art.ticket): a tilted card baseline-anchored on the same 480x400 item
     canvas as every other object, mostly transparent around it. Same zoom+shift idea as the cat chips
     below, tuned to the ticket's content band instead of the cat's so it sits centred in the chip
     rather than pinned to the bottom edge. */
  .book-chip.dest img.ticket-img { position: absolute; width: auto; height: 137%; top: -53%; left: 50%; transform: translateX(-50%); }
  /* The stamp badge (see STAMP_CHANCE/art.stamp): a small corner marker on a destination chip once
     its stamp is collected, independent of the ticket art underneath. */
  .book-chip img.stamp-badge { position: absolute; z-index: 1; right: 3px; bottom: 3px; width: 16px; height: 16px;
    border-radius: 50%; object-fit: contain; background: rgba(255,255,255,.9);
    box-shadow: 0 1px 2px rgba(0,0,0,.35); pointer-events: none;
    overflow: hidden; font-size: 0; color: transparent; }   /* no stamp art yet (see art.stamp) -- a
    quiet blank circle rather than a broken-image icon + alt text until raw/stamps/stamp-<dest>.png lands.
    ".book-chip img" prefix needed so this beats that rule's own specificity. */
  /* Cat chips (not .dest): the sit-pose art is a tall canvas with the cat sitting low, lots of empty
     headroom above -- plain cover just scales the whole canvas in, leaving the cat crammed low in
     the circle. Zoom and shift to the cat's own band (see process_art.py SIT_HEIGHT/BASELINE_PAD)
     so it reads centred, the way the other chips naturally do. */
  .book-chip:not(.dest) img { position: absolute; width: auto; height: 167%; top: -67%; left: 50%; transform: translateX(-50%); }
  .book-chip.active { border-color: var(--leaf, #5a9a4a); box-shadow: 0 0 0 2px var(--leaf, #5a9a4a); }
  .book-chip.empty { opacity: .4; filter: grayscale(.6); }
  .book-chip.empty.active { opacity: .7; }
  .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin-top: 10px; }
  .book-grid .polaroid.mini { cursor: pointer; }
  .book-grid .polaroid.dim { opacity: .3; }
  /* The stamp book (see stampsHtml): one passport-style slot per destination. Blank/dashed until
     collected, then a solid ink-red frame around the stamp art. */
  .stamp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
  .stamp-slot { border: 2px dashed var(--line); border-radius: 12px; padding: 14px 10px; text-align: center; background: #fff; }
  .stamp-slot.got { border-style: solid; border-color: #b23b3b; background: #fff8f4; }

     get cropped into a circle it doesn't fill. The circle is only for the "?" placeholder. */
  .stamp-face { height: 76px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; }
  .stamp-face span { width: 76px; height: 76px; border-radius: 50%; background: #f3f1ea;
    color: var(--muted); font-size: 1.6rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .stamp-face img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
  .stamp-label .ja { display: block; font-size: 1.05rem; }
  .stamp-label .en { display: block; font-size: .78rem; color: var(--muted); margin-top: 2px; }
  .muted { color: var(--muted); }

  .placing { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(12px, env(safe-area-inset-bottom)) + 74px); z-index: 20; display: flex; align-items: center; gap: 10px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 8px 6px 16px; white-space: nowrap; }
  .placing .btn { padding: 2px 12px; }
  #toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(max(10px, env(safe-area-inset-top)) + 64px); z-index: 40; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 400px); }
  .toast { background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 16px; font-weight: 500; text-align: center; animation: toast 3.8s ease forwards; }
  .toast .ja { font-size: 1.1rem; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  #test { position: fixed; left: 8px; bottom: 80px; z-index: 12; display: flex; flex-direction: column; gap: 6px; }
  #test .btn { font-size: .78rem; padding: 3px 10px; }

  /* ---------- Study overlay: a study app in a frame, above the game ---------- */
  #study { position: fixed; inset: 0; z-index: 35; background: var(--paper); display: flex; flex-direction: column; }
  .study-bar {
    display: flex; align-items: center; gap: 12px; padding: max(10px, env(safe-area-inset-top)) 12px 10px;
    border-bottom: 2.5px solid var(--ink); background: var(--paper);
  }

  #studyFrame { flex: 1 1 auto; width: 100%; border: 0; background: var(--paper); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } #world { scroll-behavior: auto; } }

  const WEATHER_ZONES = {

  const LEAF_SPREAD = [
    { frac: .10, delay: 0,   dur: 7.5 },
    { frac: .28, delay: 1.8, dur: 6.5 },
    { frac: .45, delay: 3.4, dur: 8 },
    { frac: .62, delay: .9,  dur: 7 },
    { frac: .80, delay: 2.6, dur: 6.8 },
    { frac: .93, delay: 4.2, dur: 7.3 },

  function weatherZoneHtml(z) {
    const clip = `inset(${z.top}% ${100 - z.right}% ${100 - z.bottom}% ${z.left}%)`;
    const fall = z.bottom - z.top;
    const leaves = LEAF_SPREAD.map(({ frac, delay, dur }, i) => {
      const left = z.left + frac * (z.right - z.left);
      return `<span class="leaf-sway" style="left:${left.toFixed(1)}%;top:${z.top}%;animation-duration:${(dur * .6).toFixed(1)}s;animation-delay:${delay}s">` +

    }).join('');
    return `<div class="weather" aria-hidden="true" style="clip-path:${clip}">${leaves}</div>`;

  // own clipped layer, since clip-path only takes one shape and the gap between the rects (a roof

  function weatherHtml(roomId) {

    return {
      shadow,
      img: grow ? `<div class="layer"${grow}>${body}</div>${reflection}` : `${body}${reflection}`,

  const thumb = (id) => {

  const catPortrait = (id, sil) => `<div class="portrait-cat${sil ? ' sil' : ''}"><img src="${art.cat(id, 'sit')}" alt=""></div>`;
  // Poses still enough to read as "resting" rather than mid-action -- see catLayer's `breathes`.
  const BREATHE_POSES = new Set(['sleep', 'sit', 'lie', 'peer', 'belly1', 'belly2', 'soak']);
  // Cats with a tail split from their pose art so it can swish on its own (see raw/cats/<cat>-<pose>
  // -notail.png + -tail.png, and process_cat_tail in process_art.py, which saves the aligned overlay
  // to cats/<cat>/<pose>-tail.webp). origin is the tail's base -- where it meets the body -- found by
  // process_cat_tail's placement math, not guessed: the closest point between the two cutouts in
  // their shared raw canvas, converted to % of the 480x400 pose canvas (its log line prints it ready
  // to paste here). Add a '<cat>-<pose>' entry as each cat's tail is extracted.
  const CAT_TAILS = {
    'tapuz-belly1': { origin: '60.5% 88.2%' },
    'sheleg-belly1': { origin: '59.0% 91.1%' },
  };
  // Cats with a second pair of paws split from their pose art (see raw/cats/<cat>-<pose>-paws.png and
  // process_cat_paws in process_art.py, which saves the aligned overlay to cats/<cat>/<pose>-paws.webp),
  // so a held item can sit sandwiched between the body's own (resting) paws and this overlay -- body,
  // then the item, then the paws on top, so it reads as the cat hugging the item rather than it just
  // resting on top. left/top/w place the item's own (untrimmed) 480x400 canvas on the pose's shared
  // 480x400 canvas (not baseline-anchored like a normal item). w is sized so the item's visible content
  // renders at the SAME on-screen size it has sitting on the floor at its normal item scale (e.g.
  // temaki-ball's 0.5) -- matched by measuring both on screen, not eyeballed -- and left/top are offset
  // so that content, not the canvas's own empty-margin centre, lands in the gap between the paws. Only
  // items with `hugged: true` use this (see spotHtml, which otherwise draws the item at its own normal
  // baseline position in the spot).
  const CAT_HUG = {
    'barzel-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'dvash-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'kafe-belly2': { left: 36.26, top: 44.51, w: 38.64 },
    'kinamon-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'kokhav-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'lilach-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'namer-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'pilpel-belly2': { left: 37.51, top: 44.51, w: 38.64 },
    'rimon-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'sheleg-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'shoko-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'silan-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'tapuz-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'tchelet-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'zayit-belly2': { left: 37.51, top: 42.01, w: 38.64 },
    'zohar-belly2': { left: 37.51, top: 42.01, w: 38.64 },
  };
  function catLayer(v, it, itemId) {
    const pose = v.pose || it.pose;
    const o = (it.offset && it.offset[v.cat]) || { x: 0, y: 0, s: 1 };
    const po = (it.poseOffset && it.poseOffset[pose]) || { x: 0, y: 0 };
    const x = it.cat.x + o.x + po.x, y = it.cat.y + o.y + po.y, w = CAT_WIDTH * (it.catScale || 1) * (o.s || 1);
    // Only 'lie' (ball, yarn, takoyaki) puts the cat on open floor beside the item, so it's the
    // only pose that needs its own shadow -- every other pose sits on or in the item itself,
    // where the item's own shadow already covers the ground contact.
    const shadow = pose === 'lie' ? SHADOW_SVG : '';
    // Resting poses get the same gentle breathing scale-pulse as sleep (see .breathe) -- active
    // poses (head/ride/face peeking or riding, half/full eating, soaking mid-motion) are left still
    // since a cat already doing something there doesn't also need an idle "alive" cue.
    const breathes = BREATHE_POSES.has(pose);
    const tail = CAT_TAILS[`${v.cat}-${pose}`];
    const tailImg = tail ? `<img class="tail-sway" src="cats/${v.cat}/${pose}-tail.webp" alt="" style="transform-origin:${tail.origin}">` : '';
    const hug = it.hugged && itemId ? CAT_HUG[`${v.cat}-${pose}`] : null;
    const hugImg = hug ? `<img class="layer" src="${art.item(itemId)}" alt="" style="position:absolute;left:${hug.left}%;top:${hug.top}%;width:${hug.w}%;height:auto">` : '';
    const pawsImg = hug ? `<img class="layer" src="cats/${v.cat}/${pose}-paws.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%">` : '';
    return `<div class="cat-layer${v.fresh ? ' cat-in' : ''}" style="left:${x - w * 0.5}%;top:${y - w * 0.97}%;width:${w}%">` +
      shadow + `<img class="${breathes ? 'breathe' : ''}" src="${art.cat(v.cat, pose)}" alt="">${tailImg}${hugImg}${pawsImg}</div>`;
  }

  /* ---------- Visiting logic (same rules as the yard, now per room) ---------- */
  // CATS[id].only, when set, restricts a cat to just those item ids -- every other cat gets a 0.4

  // (e.g. nitzan/zohar, sit-only so far) would otherwise be picked for an item needing a pose it
  // has no art for. Also doubles as the "gate by item, not season" mechanism for a seasonal cat.
  function pickCat(itemId, present) {
    const pool = CAT_ORDER.filter((id) => !present.has(id) && (!CATS[id].only || CATS[id].only.includes(itemId)))
      .map((id) => ({ id, w: CATS[id].rarity * (CATS[id].likes[itemId] || 0.4) }));
    const total = pool.reduce((a, b) => a + b.w, 0);
    if (!total) return null;
    let r = Math.random() * total;
    for (const p of pool) { r -= p.w; if (r <= 0) return p.id; }
    return pool[pool.length - 1].id;
  }
  // A visit's pose is picked at random from the item's poses that have art.
  function pickPose(it) {
    const ok = (it.poses || [it.pose]).filter((p) => READY_POSES.has(p));
    return ok.length ? ok[Math.floor(Math.random() * ok.length)] : it.pose;
  }
  // Like pickCat, but restricted to FOOD_CAT_POOL (only cats with 'full' art so far) and weighted
  // by rarity alone -- there's no single item here for a `likes` bonus to apply against.
  function pickFoodCat(present) {
    const pool = FOOD_CAT_POOL.filter((id) => !present.has(id)).map((id) => ({ id, w: CATS[id].rarity }));
    const total = pool.reduce((a, b) => a + b.w, 0);
    if (!total) return null;
    let r = Math.random() * total;
    for (const p of pool) { r -= p.w; if (r <= 0) return p.id; }
    return pool[pool.length - 1].id;
  }
  function simulate(now) {
    const ev = { arrived: [], changed: false, span: 0 };
    if (state.lastCheck == null) { state.lastCheck = now; ev.changed = true; return ev; }
    const span = Math.max(0, Math.min(now - state.lastCheck, MAX_AWAY_HOURS * 3600e3));
    const start = now - span;
    ev.span = span;
    Object.keys(state.visitors).forEach((k) => {
      const v = state.visitors[k], [room, i] = k.split(':');
      if (now >= v.leave || !state.spots[room][+i]) { state.gifts += v.gift; delete state.visitors[k]; ev.changed = true; }
    });
    // Food is eaten up after its duration: the spot goes empty and the item is gone from the Bag too.
    if (state.food && now >= state.food.expiresAt) {
      state.owned = state.owned.filter((id) => id !== state.food.id);
      state.food = null;
      ev.changed = true;
    }
    // A cat eating at the food spot (state.foodVisitor) leaves when it's done, same gift-on-leave
    // rule as any other visit -- or right away if the food itself is already gone, since there's
    // nothing left to eat.
    if (state.foodVisitor && (now >= state.foodVisitor.leave || !state.food)) {
      state.gifts += state.foodVisitor.gift;
      state.foodVisitor = null;
      ev.changed = true;
    }
    // A cat on a day trip comes home with a polaroid (see state.trip / state.selfies, and the
    // "Trips" shop page). One entry per cat+destination, keyed "<cat>:<dest>:<pose>:<bg>" -- the pose
    // and bg variant (see BG_VARIANTS) are each rolled once, on first arrival, and then stuck with;
    // a repeat trip doesn't add a new entry.
    if (state.trip && now >= state.trip.returnsAt) {
      const { catId, destId } = state.trip, pairKey = `${catId}:${destId}`;
      if (!state.selfies.some((s) => s.startsWith(`${pairKey}:`))) state.selfies.push(`${pairKey}:${randomPose(catId)}:${pickBgKey(destId)}`);
      let stampWon = false;
      if (!state.stamps.includes(destId) && Math.random() < STAMP_CHANCE) { state.stamps.push(destId); stampWon = true; }
      ev.tripHome = { catId, destId, stampWon };
      state.trip = null;
      ev.changed = true;
    }
    const present = new Set(Object.values(state.visitors).map((v) => v.cat));
    if (state.trip) present.add(state.trip.catId);   // a traveling cat can't also be visiting a room

      // A cat wandering over to eat whatever's out at the food spot -- same arrival odds as any
      // other visit, just keyed to state.foodVisitor instead of a room spot (see above).
      if (state.food && !state.foodVisitor && Math.random() < 1 - Math.exp(-span / (ARRIVAL_MINUTES * 60e3))) {
        const cat = pickFoodCat(present);
        if (cat) {
          present.add(cat);
          const arrive = start + Math.random() * span, leave = arrive + rand(STAY_MIN, STAY_MAX) * 60e3;
          const gift = randInt(CATS[cat].gift[0], CATS[cat].gift[1]);

        }
      }
      ROOMS.forEach((r) => state.spots[r.id].forEach((itemId, i) => {
        const k = key(r.id, i);
        if (!itemId || state.visitors[k] || isSecondary(r.id, i) || isRetired(r.id, i)) return;
        if (Math.random() >= 1 - Math.exp(-span / (ARRIVAL_MINUTES * 60e3))) return;
        const cat = pickCat(itemId, present);
        if (!cat) return;
        present.add(cat);
        const arrive = start + Math.random() * span, leave = arrive + rand(STAY_MIN, STAY_MAX) * 60e3;
        const gift = randInt(CATS[cat].gift[0], CATS[cat].gift[1]);
        state.seen[cat] = (state.seen[cat] || 0) + 1;
        ev.arrived.push({ cat, room: r.id });
        ev.changed = true;
        if (leave <= now) state.gifts += gift; else state.visitors[k] = { cat, pose: pickPose(ITEMS[itemId]), arrive, leave, gift, fresh: true };
      }));

  }
  function tick(summary) {
    const ev = simulate(Date.now());

      const bonus = stampWon ? ` ...and a ${DESTINATIONS[destId].en} stamp!` : '';

    }
    if (!ev.arrived.length) return;

    else ev.arrived.forEach((a) => { const r = ROOMS.find((x) => x.id === a.room); toast(`${CATS[a.cat].tr} came to the ${jaSpan(r.ja)} ${r.en}!`); });
  }

  /* ---------- Rendering ---------- */
  const world = $('world');

  function spotHtml(room, i) {
    if (isSecondary(room.id, i) || isRetired(room.id, i)) return '';
    const itemId = state.spots[room.id][i], v = state.visitors[key(room.id, i)];
    // An XL item is drawn at the middle of its row. Rows can sit left or right, so the baths form a
    // diagonal -- unless the item pins its own side via xlX (gym: always the right, so the 2x-scaled
    // frame never overflows toward the dining room next door).
    const p = isXL(itemId) ? { x: (ITEMS[itemId].xlX != null ? ITEMS[itemId].xlX : XL_X[i >= 2 ? 1 : 0]), y: (SPOTS[i].y + SPOTS[i + 1].y) / 2 + XL_DROP } : SPOTS[i];

    } else {
      const it = ITEMS[itemId], L = itemLayers(itemId, true);
      const water = it.water ? `<img class="water" src="objects/${itemId}-water.webp" alt="" style="left:${it.water.x}%;top:${it.water.y}%;width:${it.water.w}%">` : '';

      // baseline-anchored picture (L.img) would otherwise draw it a second time, floating on the floor.

      // it.inFront: the cat sits slightly behind this item (lantern, kazaguruma, sakura-vase -- all
      // decorative items a cat just sits beside, not in/on), so draw the item's own picture after the
      // cat instead of before, otherwise the cat's sprite -- much wider than the item -- paints over it.
      // The ground shadow stays under the cat either way; only the item's own picture reorders.

      label = v ? `${CATS[v.cat].tr} ${POSE_LABEL[v.pose || it.pose]} on the ${it.en}` : `${it.tr} (${it.en})`;

    }
    return `<button class="spot" data-room="${room.id}" data-i="${i}" aria-label="${label}" style="left:${p.x}%;bottom:${100 - p.y}%;z-index:${p.y}">${inner}</button>`;
  }
  // The food spot: one fixed place in the dining room, separate from its four item spots. Empty,
  // it gets the same dashed-oval empty-mark as a regular spot, but in amber (var(--sun)) instead
  // of white, so it reads as a different kind of spot at a glance.
  function foodHtml() {
    const f = state.food;
    let inner = '', label;
    if (!f) {
      inner = `<svg class="layer" viewBox="0 0 120 100" aria-hidden="true"><g class="empty-mark"><ellipse cx="60" cy="90" rx="30" ry="8" fill="rgba(246,185,59,.28)" stroke="#F6B93B" stroke-width="2" stroke-dasharray="5 5"/><path d="M60 84 V96 M54 90 H66" stroke="#F6B93B" stroke-width="2.6" stroke-linecap="round"/></g></svg>`;
      label = 'Food spot, empty. Set out food for the cats here.';
    } else {
      const it = ITEMS[f.id], L = itemLayers(f.id, true);
      inner = L.shadow + L.img + L.front;
      label = `${it.tr} (${it.en}), set out at the food spot`;
    }
    // z-index 95: above every regular spot (max 80), the same fix as the study desk — a regular
    // spot's invisible button box is much bigger than its art and was swallowing the food spot's taps.
    return `<button class="spot food-spot" data-food aria-label="${label}" style="left:${FOOD_SPOT.x}%;bottom:${100 - FOOD_SPOT.y}%;z-index:95">${inner}</button>`;
  }
  // The cat eating beside the food, if one's currently visiting (state.foodVisitor) -- a second
  // fixed spot next to FOOD_SPOT, only rendered while occupied (nothing to put out or pick up here,
  // unlike every other spot, so an empty food-cat-spot has nothing to show or click).
  function foodCatHtml() {
    const v = state.foodVisitor;
    if (!v) return '';
    const inner = catLayer(v, FOOD_CAT_ITEM);
    v.fresh = false;
    return `<button class="spot food-cat-spot" data-food-cat aria-label="${CATS[v.cat].tr} ${poseLabel(v.pose)} beside the food" style="left:${FOOD_CAT_SPOT.x}%;bottom:${100 - FOOD_CAT_SPOT.y}%;z-index:94">${inner}</button>`;
  }
  // The picture is six rooms wide: a margin, the four rooms, and a margin. The margins have no spots.
  // They are only ever seen beside the first and last rooms.
  const MARGINS = { left: { id: 'margin-left', en: 'dining room wall', slice: 0 }, right: { id: 'margin-right', en: 'garden', slice: 5 } };
  function renderRooms() {
    const sections = [{ ...MARGINS.left, margin: true }, ...ROOMS.map((r, i) => ({ ...r, slice: i + 1 })), { ...MARGINS.right, margin: true }];
    world.innerHTML = sections.map((r) =>
      `<section class="room r-${r.id}" style="--slice:${r.slice}" aria-label="${r.en}"><div class="stage"><div class="bg"></div><div class="tint"></div>` +
      (r.margin ? '' : weatherHtml(r.id) + SPOTS.map((_, i) => spotHtml(r, i)).join('') + (r.id === FOOD_SPOT.room ? foodHtml() + foodCatHtml() : '')) +
      `</div></section>`).join('');

  }
  function renderChrome() {
    const r = ROOMS[cur];

    $('prev').disabled = cur === 0; $('next').disabled = cur === ROOMS.length - 1;
    $('dots').innerHTML = ROOMS.map((x, i) =>
      `<button class="dot" role="tab" data-go="${i}" aria-current="${i === cur}" aria-label="${x.en}">${i === cur ? jaSpan(x.ja) : (i + 1)}</button>`).join('');
  }
  function renderWallet(bump) {
    const el = $('fish');
    el.textContent = '🐟 ' + getFish();
    if (bump) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 220); }
    $('giftBtn').hidden = !state.gifts;
    $('giftBtn').textContent = `🎁 ${state.gifts}`;
  }
  // A little always-visible badge for "a cat is traveling", since otherwise the only place that
  // showed it was the Trips shop page itself (see cardHtml's `trip` case) -- easy to lose track of.
  // Refreshed every tick (not just on state changes) so the countdown keeps counting down live.
  function renderTripBadge() {
    const btn = $('tripBtn');
    btn.hidden = !state.trip;
    if (!state.trip) return;
    const mins = Math.max(1, Math.round((state.trip.returnsAt - Date.now()) / 60e3));
    btn.textContent = `🧳 ${CATS[state.trip.catId].tr} · ${mins}m`;
  }
  // Each section sits at its offset from the current room: 0 in the middle, -1 to the left, +1 to the right.
  // The current room is at position cur + 1, because the left margin is section 0. Nothing wraps.
  function placeRooms() {
    [...world.children].forEach((el, k) => {
      const d = k - (cur + 1);
      // A section that moves more than one place (a jump with the dots) appears in place rather than flying across.
      // Only sections that move one place slide.
      const prev = el.dataset.d === undefined ? null : +el.dataset.d;
      el.dataset.d = d;
      const jump = prev === null || Math.abs(d - prev) > 1;
      if (jump) el.style.transition = 'none';
      el.style.transform = `translateX(calc(-50% + ${d} * var(--W)))`;
      if (jump) { void el.offsetWidth; el.style.transition = ''; }
      el.classList.toggle('current', d === 0);
    });
  }
  // The rooms run in a line and stop at the ends. The margins beside the first and last rooms show the picture beyond them.
  function goRoom(i) {
    const next = Math.max(0, Math.min(ROOMS.length - 1, i));
    if (next === cur) return;

  }
  function stepRoom(dir) { goRoom(cur + dir); }

  /* ---------- Sheets ---------- */
  let sheetCtx = null;
  // Set while a zoomed polaroid (opened from the Polaroids book, see openPolaroidZoom) is showing,
  // so its Close button returns to the book instead of closing the whole Cats sheet.
  let zoomReturn = false;
  function openSheet(html) {

    const f = $('sheet').querySelector('button'); if (f) f.focus();
  }
  function closeSheet() { $('overlay').hidden = true; sheetCtx = null; zoomReturn = false; }

  function openSpot(roomId, i) {
    sheetCtx = { roomId, i };
    const itemId = state.spots[roomId][i], v = state.visitors[key(roomId, i)];
    if (v) {
      const c = CATS[v.cat], it = ITEMS[itemId], mins = Math.max(1, Math.round((v.leave - Date.now()) / 60e3));
      openSheet(`<div class="portrait">${catPortrait(v.cat)}<div><h2>${c.tr}</h2><div class="muted">“${c.en}”</div>
        <p>${POSE_LABEL[v.pose || it.pose][0].toUpperCase() + POSE_LABEL[v.pose || it.pose].slice(1)} on the ${jaSpan(it.ja)}. Staying about ${mins} more minute${mins > 1 ? 's' : ''}.</p></div></div>
        <div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
    } else if (itemId) {
      const it = ITEMS[itemId];
      openSheet(`<div class="portrait">${thumb(itemId)}<div><span class="ja big" lang="ja">${it.ja}</span><h2>${it.tr}</h2><div class="muted">${it.en}</div><p>No one here yet.</p></div></div>
        <div class="row"><button class="btn plain" data-act="remove">Put it away</button><button class="btn" data-act="close">Close</button></div>`);
    } else {
      const room = ROOMS.find((r) => r.id === roomId);
      const free = state.owned.filter((id) => ITEMS[id].room === roomId && !ITEMS[id].food && !isPlaced(id) && fits(roomId, i, id));
      const body = free.length
        ? `<div class="pick">${free.map((id) => `<button data-place="${id}">${thumb(id)}${jaSpan(ITEMS[id].ja)}<span>${ITEMS[id].tr}</span></button>`).join('')}</div>`
        : `<p class="muted">You have nothing for the ${room.en} yet. Open the shop to buy something for this room.</p>`;
      openSheet(`<h2>Put out an item · ${jaSpan(room.ja)}</h2>${body}<div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
    }
  }
  // The food spot: no visitor, just the food itself and when it will be eaten up.
  function openFood() {
    const f = state.food;
    if (f) {
      const it = ITEMS[f.id], mins = Math.max(1, Math.round((f.expiresAt - Date.now()) / 60e3));
      openSheet(`<div class="portrait">${thumb(f.id)}<div><span class="ja big" lang="ja">${it.ja}</span><h2>${it.tr}</h2><div class="muted">${it.en}</div><p>Set out for the cats. Gone in about ${mins} minute${mins > 1 ? 's' : ''}.</p></div></div>
        <div class="row"><button class="btn plain" data-act="food-remove">Put it away</button><button class="btn" data-act="close">Close</button></div>`);
    } else {
      const room = ROOMS.find((r) => r.id === FOOD_SPOT.room);
      const free = state.owned.filter((id) => ITEMS[id].food);
      const body = free.length
        ? `<div class="pick">${free.map((id) => `<button data-place-food="${id}">${thumb(id)}${jaSpan(ITEMS[id].ja)}<span>${ITEMS[id].tr}</span></button>`).join('')}</div>`
        : `<p class="muted">You have no food yet. Open the shop to buy some for the ${room.en}.</p>`;
      openSheet(`<h2>Set out food · ${jaSpan(room.ja)}</h2>${body}<div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
    }
  }
  // The cat eating beside the food -- only ever opens while state.foodVisitor is set (see
  // foodCatHtml), so there's no "empty" branch like openFood has.
  function openFoodCat() {
    const v = state.foodVisitor, c = CATS[v.cat], mins = Math.max(1, Math.round((v.leave - Date.now()) / 60e3));
    openSheet(`<div class="portrait">${catPortrait(v.cat)}<div><h2>${c.tr}</h2><div class="muted">“${c.en}”</div>
      <p>${poseLabel(v.pose)[0].toUpperCase() + poseLabel(v.pose).slice(1)} beside the food. Staying about ${mins} more minute${mins > 1 ? 's' : ''}.</p></div></div>
      <div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
  }
  // Picking a cat to send on a day trip. Only cats that have actually visited (state.seen) are
  // offerable -- sending one you've never met would be backwards -- and rare, `only`-gated cats
  // (TRIPPABLE excludes them) never show up here at all.
  let tripPickDest = null;
  function openTripPick(destId) {
    tripPickDest = destId;
    const d = DESTINATIONS[destId];
    const avail = TRIPPABLE.filter((id) => (state.seen[id] || 0) > 0);
    const body = avail.length
      ? `<div class="pick">${avail.map((id) => `<button data-trip-pick="${id}">${catPortrait(id)}<span>${CATS[id].tr}</span></button>`).join('')}</div>`
      : `<p class="muted">No cats have visited yet to send on a trip.</p>`;
    openSheet(`<h2>Send a cat · ${jaSpan(d.ja)}</h2>${body}<div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
  }
  function startTrip(catId) {
    const destId = tripPickDest, d = DESTINATIONS[destId], fish = getFish();
    if (!d || state.trip || fish < d.price) return;   // stale sheet (e.g. a trip started in another tab/tick)
    Object.keys(state.visitors).forEach((k) => { if (state.visitors[k].cat === catId) delete state.visitors[k]; });
    state.trip = { catId, destId, returnsAt: Date.now() + d.duration * 60e3 };
    setFish(fish - d.price);
    save(); renderRooms(); renderTripBadge();
    toast(`${CATS[catId].tr} left for ${d.en}!`);
    openShop(shopIdx);
  }
  // The shop browses the rooms with the ‹ › buttons, one page per room, in ROOMS order, except
  // Food leads as its own page before every room — it's a separate kind of item (consumable, set
  // out at FOOD_SPOT, not one of the four regular spots), so it reads oddly mixed into the dining
  // room's furniture page. Trips trail at the very end, as the "pinnacle" page past every room.
  // sectionFor() maps a game room to its shop page, skipping over Food and Trips.
  const SHOP_SECTIONS = [{ kind: 'food' }, ...ROOMS.map((r) => ({ kind: 'room', room: r })), { kind: 'trip' }];
  const sectionFor = (roomId) => SHOP_SECTIONS.findIndex((s) => s.kind === 'room' && s.room.id === roomId);
  let shopIdx = 0, shopPage = 0;
  const SHOP_PAGE = 4;   // items per screen, as a 2 x 2 grid
  const ticketThumb = (dest) => `<div class="thumb"><img class="layer" src="${art.ticket(dest)}" alt=""></div>`;
  function openShop(idx) {
    if (idx !== undefined) {
      const n = ((idx % SHOP_SECTIONS.length) + SHOP_SECTIONS.length) % SHOP_SECTIONS.length;
      if (n !== shopIdx) shopPage = 0;
      shopIdx = n;
    }
    const section = SHOP_SECTIONS[shopIdx], fish = getFish();
    const label = section.kind === 'food' ? { ja: '食', en: 'food' } : section.kind === 'trip' ? { ja: '旅', en: 'day trips' } : { ja: section.room.ja, en: section.room.en };
    const all = (section.kind === 'food' ? Object.keys(ITEMS).filter((id) => ITEMS[id].food)
      : section.kind === 'trip' ? Object.keys(DESTINATIONS)
      : Object.keys(ITEMS).filter((id) => ITEMS[id].room === section.room.id && !ITEMS[id].food && !ITEMS[id].delisted)
    ).sort((a, b) => (section.kind === 'trip' ? DESTINATIONS[a].price - DESTINATIONS[b].price : ITEMS[a].price - ITEMS[b].price));
    const pages = Math.max(1, Math.ceil(all.length / SHOP_PAGE));
    shopPage = Math.min(shopPage, pages - 1);
    const ids = all.slice(shopPage * SHOP_PAGE, (shopPage + 1) * SHOP_PAGE);
    // Item pages: the middle arrows only show when the room has more than one page of four.
    const pager = (dir, pageLabel) => pages > 1 ? `<button class="btn plain" data-shop-page="${dir}" aria-label="${pageLabel}" ${shopPage + dir < 0 || shopPage + dir >= pages ? 'disabled' : ''}>${dir < 0 ? '‹' : '›'}</button>` : '<span></span>';
    const tripDuration = (mins) => { const h = Math.floor(mins / 60), m = mins % 60; return m ? `${h}h ${m}m` : `${h}h`; };
    const cardHtml = section.kind === 'trip' ? (id) => {
      const d = DESTINATIONS[id];
      const eligible = TRIPPABLE.some((cid) => (state.seen[cid] || 0) > 0);
      // Same thumb/ja/en/act shape as a regular item card, so this page fills the same grid height
      // as every other shop page. Only one cat can travel at a time (see state.trip), so the card
      // shows status instead of a buy button whenever a trip -- to here or elsewhere -- is active.
      let act;
      if (state.trip && state.trip.destId === id) {
        const mins = Math.max(1, Math.round((state.trip.returnsAt - Date.now()) / 60e3));
        act = `<div class="tag" style="color:var(--muted)">${CATS[state.trip.catId].tr} · back in ${mins}m</div>`;
      } else if (state.trip) {
        act = `<div class="tag" style="color:var(--muted)">A cat is already traveling</div>`;
      } else if (!eligible) {
        act = `<button class="btn" disabled title="Meet a cat first">${d.price} 🐟</button>`;
      } else {
        act = `<button class="btn" data-trip="${id}" ${fish < d.price ? 'disabled' : ''}>${d.price} 🐟</button>`;
      }
      return `<div class="card">${ticketThumb(id)}${jaSpan(d.ja)}<div class="en">${d.en} · ${tripDuration(d.duration)}</div>${act}</div>`;
    } : (id) => {
      const it = ITEMS[id], owned = state.owned.includes(id);
      const act = owned ? `<div class="tag">${isPlaced(id) ? 'Out in a room' : 'Owned'}</div>`
        : `<button class="btn" data-buy="${id}" ${fish < it.price ? 'disabled' : ''}>${it.price} 🐟</button>`;
      return `<div class="card">${thumb(id)}${jaSpan(it.ja)}<div class="en">${it.en}</div>${act}</div>`;
    };
    openSheet(`<button class="btn plain sheet-x" data-act="close" aria-label="Close">✕</button>` +
      `<div class="shop-head"><h2>Shop</h2></div>` +
      `<div class="shop-room"><button class="btn plain" data-shop-step="-1" aria-label="Previous">‹</button>` +
      `<span>${jaSpan(label.ja)} <span class="muted">${label.en}</span></span>` +
      `<button class="btn plain" data-shop-step="1" aria-label="Next">›</button></div>` +
      `<div class="shop-body">${pager(-1, 'Earlier items')}<div class="grid">${ids.map(cardHtml).join('')}${'<div class="card ghost" aria-hidden="true"><div class="thumb"></div><span class="ja">&nbsp;</span><div class="en">&nbsp;</div><span class="btn">&nbsp;</span></div>'.repeat(SHOP_PAGE - ids.length)}</div>${pager(1, 'Later items')}</div>`);
  }
  // The bag lists everything bought, by room. Items out in a room say where they are.
  const spotOf = (id) => { for (const r of ROOMS) { const i = state.spots[r.id].indexOf(id); if (i !== -1) return { roomId: r.id, i }; } return null; };
  // The first empty spot in a room the item fits, with no cat visiting it.
  const freeSpotFor = (roomId, id) => SPOTS.findIndex((_, i) => !state.spots[roomId][i] && !state.visitors[key(roomId, i)] && !isRetired(roomId, i) && fits(roomId, i, id));
  // Put out: the player picks the spot. The item waits in 'placing' until a spot is tapped or Cancel.
  let placing = null;
  function startPlacing(id) {
    const it = ITEMS[id];
    placing = id;
    $('placingText').innerHTML = `Tap ${it.food ? 'the food spot' : 'a spot'} for ${jaSpan(it.ja)} ${it.tr}`;
    $('placing').hidden = false;
  }
  function endPlacing() { placing = null; $('placing').hidden = true; }
  function placeAt(roomId, i) {
    const id = placing;
    if (ITEMS[id].food) { toast(`${jaSpan(ITEMS[id].ja)} can only be set out at the food spot in the dining room.`); return; }
    if (state.spots[roomId][i] || state.visitors[key(roomId, i)]) { toast('That spot is taken. Tap an empty one.'); return; }
    if (!fits(roomId, i, id)) { toast(`${jaSpan(ITEMS[id].ja)} needs two empty spots side by side.`); return; }
    placeItem(roomId, i, id); save(); endPlacing(); renderRooms();
  }
  function placeFoodAt() {
    const id = placing;
    if (!ITEMS[id].food) { toast(`${jaSpan(ITEMS[id].ja)} can't go at the food spot. Tap a regular spot instead.`); return; }
    if (state.food) { toast('The food spot is already in use.'); return; }
    state.food = { id, expiresAt: Date.now() + ITEMS[id].duration * 60e3 };
    save(); endPlacing(); renderRooms();
  }
  function openBag() {
    const rooms = ROOMS.map((r) => {
      const ids = state.owned.filter((id) => ITEMS[id].room === r.id);
      if (!ids.length) return '';
      return `<h3 class="bag-room">${jaSpan(r.ja)} <span class="muted">${r.en}</span></h3>` + ids.map((id) => {
        const it = ITEMS[id], at = it.food ? isFoodPlaced(id) : spotOf(id);
        const act = at ? `<button class="btn plain" data-bag-away="${id}">Put away</button>` : `<button class="btn" data-bag-out="${id}">Put out</button>`;
        return `<div class="bag-item">${thumb(id)}<div>${jaSpan(it.ja)}<div class="en">${it.en}${at ? ' · out now' : ''}</div></div>${act}</div>`;
      }).join('');
    }).join('');
    openSheet(`<button class="btn plain sheet-x" data-act="close" aria-label="Close">✕</button><h2>Bag · <span class="ja" lang="ja">袋</span></h2>` +
      (rooms || '<p class="muted">Nothing in your bag yet. Open the shop to buy something.</p>'));
  }
  // The Cats sheet has two tabs: the roster (existing) and the Polaroids book (one photo per
  // cat+destination pair), and the stamp book (one slot per destination, see STAMP_CHANCE). Kept as
  // one sheet/one dock button rather than separate top-level screens, since they're all "what do I
  // know about my cats/trips" views.
  let catsTab = 'roster';
  let bookFilter = { cat: null, dest: null };
  function catsTabsHtml() {
    const tab = (id, label) => `<button class="btn${catsTab === id ? '' : ' plain'}" data-cats-tab="${id}">${label}</button>`;
    return `<div class="row" style="justify-content:center;margin-bottom:10px">` +
      tab('roster', 'Cats') + tab('book', 'Polaroids') + tab('stamps', 'Stamps') + `</div>`;
  }
  function rosterHtml() {
    return `<div class="grid">${CAT_ORDER.map((id) => {
      const c = CATS[id], n = state.seen[id] || 0;
      if (!n) return `<div class="card">${catPortrait(id, true)}<div class="ja">?</div><div class="en">Not met yet</div></div>`;
      const fav = Object.keys(c.likes).sort((a, b) => c.likes[b] - c.likes[a])[0];
      return `<div class="card">${catPortrait(id)}<div class="ja">${c.tr}</div><div class="en">“${c.en}”</div><div class="muted" style="font-size:.82rem">Visits ${n} · loves ${jaSpan(ITEMS[fav].ja)}</div></div>`;
    }).join('')}</div>`;
  }
  // state.selfies holds "<cat>:<dest>:<pose>:<bg>" keys actually collected (see tick()/simulate()).
  // The grid only ever shows pairs that are both collected AND have a tuned destination (TRIP_OFFSET)
  // -- no "?" placeholders for the rest, so a filter chip with nothing to show just goes empty rather
  // than padding the grid.
  // All collected polaroids (unfiltered), and the subset the current bookFilter shows -- shared by
  // bookHtml (to render the grid) and openPolaroidZoom (so its prev/next steps through exactly the
  // same set the grid is showing, not every polaroid regardless of filter).
  const collectedSelfies = () => state.selfies
    .map((key) => { const [c, d, pose, bg] = key.split(':'); return { c, d, pose: Number(pose) || 1, bg: bg || d }; })
    .filter(({ d }) => destHasArt(d));
  const bookCells = () => collectedSelfies().filter(({ c, d }) => (!bookFilter.cat || bookFilter.cat === c) && (!bookFilter.dest || bookFilter.dest === d));
  function bookHtml() {
    const cats = TRIPPABLE, dests = Object.keys(DESTINATIONS);
    const collected = collectedSelfies();
    const catsWithPhotos = new Set(collected.map((p) => p.c));
    const destsWithPhotos = new Set(collected.map((p) => p.d));
    const chip = (active, empty, extra, inner, badge) =>
      `<button class="book-chip${extra ? ' ' + extra : ''}${active ? ' active' : ''}${empty ? ' empty' : ''}" ${inner.attrs}>${inner.html}${badge || ''}</button>`;
    const catChips = cats.map((id) => chip(bookFilter.cat === id, !catsWithPhotos.has(id), '', { attrs: `data-book-cat="${id}"`, html: `<img src="${art.cat(id, 'sit')}" alt="${CATS[id].tr}">` })).join('');
    // No stamp badge here even when collected (see STAMP_CHANCE) -- it covered part of the ticket
    // art on these small chips. The Stamps tab is the place to see which stamps are collected.
    const destChips = dests.map((id) =>
      chip(bookFilter.dest === id, !destsWithPhotos.has(id), 'dest', { attrs: `data-book-dest="${id}"`, html: `<img class="ticket-img" src="${art.ticket(id)}" alt="${DESTINATIONS[id].en}">` })
    ).join('');
    const cells = bookCells();
    const grid = cells.length
      ? `<div class="book-grid">${cells.map(({ c, d, pose, bg }, i) => polaroidHtml(d, c, { mini: true, pose, idx: i, bg })).join('')}</div>`
      : `<p class="muted" style="text-align:center;margin-top:24px">${collected.length ? 'No polaroids for this combination yet.' : 'No polaroids yet — send a cat on a trip!'}</p>`;
    return `<p class="muted">Tap a cat or a place to filter.</p>` +
      `<div class="book-chips">${catChips}</div><div class="book-chips">${destChips}</div>` + grid;
  }
  // Tapping a mini polaroid in the book grid shows it full size, by its index into bookCells() --
  // the same filtered set the grid itself is showing, so prev/next step through exactly what's
  // currently visible rather than every polaroid regardless of filter. Close returns to the book
  // (with its filter still applied) rather than closing the whole Cats sheet, since that's where it
  // was opened from.
  function openPolaroidZoom(idx) {
    const cells = bookCells(), cell = cells[idx];
    if (!cell) return;
    zoomReturn = true;
    const prev = `<button class="btn plain" data-zoom-nav="${idx - 1}" aria-label="Previous photo" ${idx <= 0 ? 'disabled' : ''}>‹</button>`;
    const next = `<button class="btn plain" data-zoom-nav="${idx + 1}" aria-label="Next photo" ${idx >= cells.length - 1 ? 'disabled' : ''}>›</button>`;
    const frame = cells.length > 1
      ? `<div class="zoom-frame">${prev}${polaroidHtml(cell.d, cell.c, { pose: cell.pose, bg: cell.bg })}${next}</div>`
      : polaroidHtml(cell.d, cell.c, { pose: cell.pose, bg: cell.bg });
    openSheet(`<button class="btn plain sheet-x" data-act="close" aria-label="Close">✕</button>` +
      `<h2>${CATS[cell.c].tr} · ${DESTINATIONS[cell.d].en}</h2>` +
      frame +
      `<div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
  }
  // The stamp book: one slot per destination (see STAMP_CHANCE), independent of cat. A blank dashed
  // slot until collected, then the stamp art in a solid ink-red frame -- a passport-book feel rather
  // than a filterable grid, since there's only ever one slot per destination.
  function stampsHtml() {
    const slots = Object.keys(DESTINATIONS).map((id) => {
      const d = DESTINATIONS[id], got = state.stamps.includes(id);
      const face = got ? `<img src="${art.stamp(id)}" alt="${d.en}" onerror="this.outerHTML='&lt;span&gt;?&lt;/span&gt;'">` : `<span>?</span>`;
      return `<div class="stamp-slot${got ? ' got' : ''}"><div class="stamp-face">${face}</div>` +
        `<div class="stamp-label">${jaSpan(d.ja)}<span class="en">${d.en}</span></div></div>`;
    }).join('');
    return `<p class="muted">A bonus pickup from day trips, alongside the polaroid.</p>` +
      `<div class="stamp-grid">${slots}</div>`;
  }
  function openCats() {
    const body = catsTab === 'roster' ? rosterHtml() : catsTab === 'book' ? bookHtml() : stampsHtml();
    openSheet(`<h2>Cats <span class="ja" lang="ja">猫</span></h2>${catsTabsHtml()}` + body +
      `<div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
  }

  // The study desk: pick a module, and it opens full screen in a frame. Fish earned there go to the shared wallet.
  function openDesk() {
    openSheet(`<h2>Study desk</h2><p class="muted">Practise here to earn fish. Spend them on the inn.</p>` +
      `<div class="grid">${STUDY.map((m) => `<button class="card" data-study="${m.id}"><div class="ja">${m.name}</div><div class="en">${m.sub}</div><span class="btn" style="pointer-events:none">Open</span></button>`).join('')}</div>` +
      `<div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
  }
  let studyId = null;
  function openStudy(id) {
    const m = STUDY.find((x) => x.id === id); if (!m) return;
    studyId = id;
    $('studyTitle').textContent = m.name;
    $('studyFrame').src = m.href;
    $('study').hidden = false;
    $('studyBack').focus();
  }
  function closeStudy() {
    if (studyId === null) return;
    studyId = null;
    $('study').hidden = true;
    $('studyFrame').src = 'about:blank';
    renderWallet(); tick(false);
  }

  function toast(html) {
    const t = document.createElement('div');
    t.className = 'toast'; t.innerHTML = html; $('toasts').appendChild(t);
    setTimeout(() => t.remove(), 3900);
  }

  /* ---------- Events ---------- */
  world.addEventListener('click', (e) => {
    const b = e.target.closest('[data-room]'), foodBtn = e.target.closest('[data-food]'), foodCatBtn = e.target.closest('[data-food-cat]');
    if (b && placing) placeAt(b.dataset.room, +b.dataset.i);
    else if (b) openSpot(b.dataset.room, +b.dataset.i);
    else if (foodBtn && placing) placeFoodAt();
    else if (foodBtn) openFood();
    else if (foodCatBtn) openFoodCat();
  });
  $('sheet').addEventListener('click', (e) => {
    const place = e.target.closest('[data-place]'), act = e.target.closest('[data-act]'), buy = e.target.closest('[data-buy]'), study = e.target.closest('[data-study]');
    const placeFood = e.target.closest('[data-place-food]');
    const shopStep = e.target.closest('[data-shop-step]');
    const bagOut = e.target.closest('[data-bag-out]'), bagAway = e.target.closest('[data-bag-away]');
    const shopPageBtn = e.target.closest('[data-shop-page]');
    const bookCat = e.target.closest('[data-book-cat]'), bookDest = e.target.closest('[data-book-dest]');
    const catsTabBtn = e.target.closest('[data-cats-tab]');
    const tripBuy = e.target.closest('[data-trip]'), tripPick = e.target.closest('[data-trip-pick]');
    const polaroidZoom = e.target.closest('.book-grid .polaroid.mini');
    const zoomNav = e.target.closest('[data-zoom-nav]');
    if (shopStep) openShop(shopIdx + +shopStep.dataset.shopStep);
    else if (catsTabBtn) { catsTab = catsTabBtn.dataset.catsTab; openCats(); }
    else if (tripBuy) openTripPick(tripBuy.dataset.trip);
    else if (tripPick) startTrip(tripPick.dataset.tripPick);
    else if (polaroidZoom) openPolaroidZoom(+polaroidZoom.dataset.idx);
    else if (zoomNav) openPolaroidZoom(+zoomNav.dataset.zoomNav);
    else if (bookCat) { const id = bookCat.dataset.bookCat; bookFilter.cat = bookFilter.cat === id ? null : id; openCats(); }
    else if (bookDest) { const id = bookDest.dataset.bookDest; bookFilter.dest = bookFilter.dest === id ? null : id; openCats(); }
    else if (shopPageBtn) { shopPage += +shopPageBtn.dataset.shopPage; openShop(shopIdx); }
    else if (bagOut) {
      const id = bagOut.dataset.bagOut, it = ITEMS[id];
      if (!canPlaceNow(id)) { toast(it.food ? 'The food spot is already in use. Put it away first.' : `No empty spot in the ${ROOMS.find((r) => r.id === it.room).en} for ${jaSpan(it.ja)}. Put something away first.`); return; }
      closeSheet(); startPlacing(id); goRoom(ROOMS.findIndex((r) => r.id === it.room));
    } else if (bagAway) {
      const id = bagAway.dataset.bagAway;
      if (ITEMS[id].food) { state.food = null; } else { const at = spotOf(id); clearItem(at.roomId, at.i); }
      save(); renderRooms(); openBag();
    } else if (place && sheetCtx) { placeItem(sheetCtx.roomId, sheetCtx.i, place.dataset.place); save(); closeSheet(); renderRooms(); }
    else if (placeFood) { state.food = { id: placeFood.dataset.placeFood, expiresAt: Date.now() + ITEMS[placeFood.dataset.placeFood].duration * 60e3 }; save(); closeSheet(); renderRooms(); }
    else if (act && act.dataset.act === 'remove' && sheetCtx) { clearItem(sheetCtx.roomId, sheetCtx.i); save(); closeSheet(); renderRooms(); }
    else if (act && act.dataset.act === 'food-remove') { state.food = null; save(); closeSheet(); renderRooms(); }
    else if (buy) {
      const id = buy.dataset.buy, it = ITEMS[id], fish = getFish();
      if (state.owned.includes(id) || fish < it.price) return;
      state.owned.push(id); save(); setFish(fish - it.price);
      // Go straight to choosing a spot, as Put out in the Bag does. If there's nowhere for it yet, it waits in the Bag.
      if (!canPlaceNow(id)) { toast(`Bought ${jaSpan(it.ja)} ${it.tr}. ${it.food ? 'The food spot is already in use.' : 'No empty spot in that room yet.'} It is in your Bag.`); openShop(shopIdx); return; }
      closeSheet(); startPlacing(id); goRoom(ROOMS.findIndex((r) => r.id === it.room));
    } else if (study) { closeSheet(); openStudy(study.dataset.study); }
    else if (act && act.dataset.act === 'close' && zoomReturn) { zoomReturn = false; openCats(); }
    else if (act) closeSheet();
  });
  $('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeSheet(); });
  $('studyBack').addEventListener('click', closeStudy);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('overlay').hidden) closeSheet();
    else if (e.key === 'Escape' && studyId !== null) closeStudy();
    if ($('overlay').hidden && studyId === null && e.key === 'ArrowLeft') stepRoom(-1);
    if ($('overlay').hidden && studyId === null && e.key === 'ArrowRight') stepRoom(1);
  });
  $('dots').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) goRoom(+b.dataset.go); });
  $('prev').addEventListener('click', () => stepRoom(-1));
  $('next').addEventListener('click', () => stepRoom(1));
  // Swipe left or right to move. A tap, or a drag that starts on a spot, still works as before.
  let swipeX = null;
  world.addEventListener('pointerdown', (e) => { swipeX = e.clientX; });
  world.addEventListener('pointerup', (e) => {
    if (swipeX === null) return;
    const dx = e.clientX - swipeX; swipeX = null;
    if (Math.abs(dx) > 40 && studyId === null && $('overlay').hidden) stepRoom(dx < 0 ? 1 : -1);
  });
  $('shopBtn').addEventListener('click', () => openShop(sectionFor(ROOMS[cur].id)));
  $('catsBtn').addEventListener('click', openCats);
  $('bagBtn').addEventListener('click', openBag);
  $('studyBtn').addEventListener('click', openDesk);
  $('placeCancel').addEventListener('click', endPlacing);
  $('giftBtn').addEventListener('click', () => {
    const n = state.gifts; if (!n) return;
    state.gifts = 0; save(); setFish(getFish() + n); toast(`Collected ${n} 🐟 from your visitors.`);
  });
  $('tripBtn').addEventListener('click', () => openShop(SHOP_SECTIONS.length - 1));
  // Fish from a study page. Only a message from an allowed origin, sent by the open study frame, counts.
  window.addEventListener('message', (e) => {
    if (!STUDY_ORIGINS.includes(e.origin) || studyId === null || e.source !== $('studyFrame').contentWindow) return;
    const d = e.data;
    if (!d || d.type !== 'neko-ryokan:fish') return;
    const amount = Math.floor(Number(d.amount));
    if (!(amount > 0) || amount > STUDY_MAX_FISH) return;
    setFish(getFish() + amount);
    toast(`+${amount} 🐟 from your study.`);
  });
  // If a study page adds fish in another tab (or in the frame, through the shared storage), update the count here.
  // SAVE_KEY changing means another tab/window of this same game saved something (a trip starting,
  // a visitor arriving, etc.) -- adopt it immediately instead of silently sitting on this tab's own
  // stale copy, which would otherwise overwrite the newer save next time THIS tab autosaves (every
  // tick(), on any change). Without this, two tabs open at once can lose data from one of them with
  // no warning -- e.g. a trip started in tab A quietly vanishing when tab B's next save fires.
  window.addEventListener('storage', (e) => {
    if (e.key === FISH_KEY) renderWallet(true);
    if (e.key === SAVE_KEY && e.newValue) { state = load(); renderRooms(); renderChrome(); renderWallet(); renderTripBadge(); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderWallet(); tick(true); } });

  /* ---------- Testing tools (?test) ---------- */
  const testMode = /[?&]test\b/.test(location.search);
  if (testMode) {
    $('test').hidden = false;
    $('test').addEventListener('click', (e) => {
      const b = e.target.closest('[data-test]'); if (!b) return;
      if (b.dataset.test === 'fish') setFish(getFish() + 50);
      if (b.dataset.test === 'summon') {
        const present = new Set(Object.values(state.visitors).map((v) => v.cat));
        ROOMS.forEach((r) => state.spots[r.id].forEach((itemId, i) => {
          const k = key(r.id, i);
          if (!itemId || state.visitors[k] || isSecondary(r.id, i) || isRetired(r.id, i)) return;
          const cat = pickCat(itemId, present); if (!cat) return;
          present.add(cat); state.seen[cat] = (state.seen[cat] || 0) + 1;
          state.visitors[k] = { cat, pose: pickPose(ITEMS[itemId]), arrive: Date.now(), leave: Date.now() + 40 * 60e3, gift: randInt(...CATS[cat].gift), fresh: true };
        }));
        if (state.food && !state.foodVisitor) {
          const foodCat = pickFoodCat(present);
          if (foodCat) {
            state.seen[foodCat] = (state.seen[foodCat] || 0) + 1;
            state.foodVisitor = { cat: foodCat, pose: pickFullPose(foodCat), arrive: Date.now(), leave: Date.now() + 40 * 60e3, gift: randInt(...CATS[foodCat].gift), fresh: true };
          }
        }
        save(); renderRooms();
      }
      if (b.dataset.test === 'reset' && confirm('Erase the inn, cats and fish?')) { store.remove(SAVE_KEY); store.remove(FISH_KEY); state = freshState(); start(); }
      if (b.dataset.test === 'trip') {
        const catId = TRIPPABLE[Math.floor(Math.random() * TRIPPABLE.length)];
        const destId = Object.keys(DESTINATIONS)[Math.floor(Math.random() * Object.keys(DESTINATIONS).length)];
        const pose = randomPose(catId), bg = pickBgKey(destId);
        openSheet(`<h2>Trip preview</h2><p class="muted">${CATS[catId].tr} · ${DESTINATIONS[destId].en} · pose ${pose} · bg ${bg}. Reopen for another random roll; tune TRIP_OFFSET in index.html to adjust.</p>` +
          polaroidHtml(destId, catId, { pose, bg }) +
          `<div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
      }
      if (b.dataset.test === 'trip-home') {
        if (!state.trip) { toast('No cat is currently traveling.'); return; }
        state.trip.returnsAt = Date.now();
        tick(false);
      }
      if (b.dataset.test === 'stamp') {
        const remaining = Object.keys(DESTINATIONS).filter((id) => !state.stamps.includes(id));
        if (!remaining.length) { toast('Every stamp is already collected.'); return; }
        const destId = remaining[Math.floor(Math.random() * remaining.length)];
        state.stamps.push(destId);
        save();
        toast(`+stamp: ${DESTINATIONS[destId].en}`);
      }
    });
  }

  /* ---------- Time of day: evening is a colour wash over the day art ---------- */
  function applyTimeOfDay() {
    const h = new Date().getHours();
    const evening = (h >= 17 && h < 20) || (h >= 5 && h < 7);
    document.querySelectorAll('.tint').forEach((t) => { t.style.background = evening ? 'linear-gradient(rgba(242,150,110,.28), rgba(242,150,110,.10))' : 'transparent'; });
  }

  // The panorama picks a seasonal file once per load (seasons don't change mid-session, unlike the
  // day/night tint, so no need to recheck on a timer). ?season=spring|winter|autumn forces one for
  // testing, bypassing the calendar; any other value (or a typo) falls through to the real month.
  function applyPano() {
    const forced = (location.search.match(/[?&]season=([a-z]+)/) || [])[1];
    const entry = forced === 'autumn' ? PANO_SEASONS.find((s) => s.file === 'scene/ryokan-pano.webp')
      : forced ? PANO_SEASONS.find((s) => s.file.includes('-' + forced))
      : PANO_SEASONS.find((s) => s.months.includes(new Date().getMonth()));
    const chosen = entry || PANO_SEASONS[1];
    document.documentElement.style.setProperty('--pano', `url("${chosen.file}")`);
    document.documentElement.dataset.weather = chosen.weather;
  }

  function start() {
    if (!state.welcomed) {
      state.welcomed = true; save(); setFish(getFish() + WELCOME_FISH);
      toast(`Welcome to the Ryokan! Swipe sideways to visit the rooms.`);
    }
    applyPano(); renderRooms(); renderChrome(); renderWallet(); tick(true);
  }
  start();
  setInterval(() => { applyTimeOfDay(); tick(false); }, TICK_MS);
})();
</script>
</body>
</html>
