<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neko Ryokan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFEF6;
    --ink: #3F3530;
    --muted: #7C6F63;
    --line: #D3DCC0;
    --sun: #F6B93B;
    --pond: #4F86B5;
    --leaf: #5E8F4A;
    /* One room is a 9:16 portrait panel: full width on a phone, a centred strip on a desktop. */
    --W: calc(100dvh * 0.5625);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #2B221C; color: var(--ink);
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif; font-size: 17px; line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  /* Japanese text: room, item and cat names. */
  .ja { font-family: "Zen Maru Gothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; font-weight: 700; }

  /* ---------- The world: four rooms side by side, swipe to move ---------- */
  /* The rooms are placed around the centre of the screen. The current room is in the middle, and its neighbours
     are either side. The rooms run in a line, so the first and last rooms have no neighbour beyond them. */
  #world { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; }
  .room {
    position: absolute; top: 0; left: 50%; width: var(--W); height: 100dvh; overflow: hidden;
    transition: transform .35s cubic-bezier(.2, .8, .2, 1);
  }
  .room:not(.current) { pointer-events: none; }
  /* The stage is the art. It covers the room (so a tall phone crops the sides a little)
     and every spot is placed in percentages of it, so items stay glued to the picture. */
  .stage {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    height: max(100dvh, calc(var(--W) * 1.7778)); aspect-ratio: 9 / 16;
    container-type: size;   /* lets children offset by a share of the picture (cqw, cqh) */
  }
  .bg { position: absolute; inset: 0; background-color: #9DCC6E; background-repeat: no-repeat; background-size: auto 100%; }
  /* The picture is six rooms wide: a margin, the four rooms, and a margin (scene/ryokan-pano.webp).
     Each section shows one slice of it, --slice from 0 to 5. The stage is one room wide and the picture is six
     stages wide, so the slice's left edge is at --slice stages and background-position is --slice / 5. */
  .bg { background-image: url("scene/ryokan-pano.webp"); background-size: auto 100%; background-position: calc(var(--slice) * 20%) 50%; }
  .tint { position: absolute; inset: 0; pointer-events: none; transition: background 1.5s ease; }
  .seam { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }

  .spot {
    position: absolute; width: 42%; aspect-ratio: 120 / 100; transform: translateX(-50%);
    padding: 0; border: 0; background: none; cursor: pointer; border-radius: 14px;
  }
  .spot .empty-mark { opacity: .75; transition: opacity .2s; }
  .spot:hover .empty-mark { opacity: 1; }
  .spot:focus-visible, .btn:focus-visible, .dot:focus-visible, .nav:focus-visible { outline: 3px solid var(--pond); outline-offset: 3px; }

  /* Art: every object and cat image is a 480 x 400 canvas, the spot's shape. */
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .thumb { position: relative; width: 100%; max-width: 136px; aspect-ratio: 6 / 5; }
  .cat-layer { position: absolute; pointer-events: none; }
  .cat-layer img { display: block; width: 100%; height: auto; }
  .portrait-cat { width: 100%; max-width: 136px; }
  .portrait-cat img { display: block; width: 100%; height: auto; }
  .sil img { filter: brightness(0); opacity: .18; }
  .breathe { animation: breathe 5.5s ease-in-out infinite; transform-origin: 50% 97%; }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012, 1.02); } }
  .cat-in { animation: catin 1.2s ease-out both; }
  @keyframes catin { from { opacity: 0; } }
  .wobble { transform-origin: 50% 92%; animation: wob 5s ease-in-out infinite; }
  .water { position: absolute; transform: translateX(-50%); pointer-events: none; animation: shimmer 4s ease-in-out infinite; will-change: transform, opacity; }
  @keyframes shimmer { 0%, 100% { opacity: .8; transform: translateX(-50%); } 50% { opacity: 1; transform: translateX(calc(-50% + 1.5%)); } }
  /* The box's bottom sits on the water line (its own top offset, read as a bottom offset) and it rises above the rim. */
  /* isolation scopes the screen blend to just this box, so Safari doesn't mis-composite the rest of the bath around it. */
  .steam { position: absolute; width: var(--sw); left: var(--sx); bottom: calc(100% - var(--sy)); height: 34%; transform: translateX(-50%); pointer-events: none; isolation: isolate; }
  .steam .puff {
    position: absolute; bottom: 0; width: 50%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0) 70%);
    filter: blur(2px); opacity: 0; mix-blend-mode: screen; animation: steam-rise linear infinite;
    will-change: transform, opacity;
  }
  @keyframes steam-rise {
    0% { transform: translateY(0) scale(.7); opacity: 0; }
    18% { opacity: .62; }
    70% { opacity: .22; }
    100% { transform: translateY(-170%) scale(1.3); opacity: 0; }
  }
  @keyframes wob { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(1.5deg); } }

  /* ---------- HUD, floating over the world ---------- */
  /* The HUD is pinned to the screen edges, not to the picture: fish top left, room name top centre, gift top right. */
  .hud { position: fixed; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  #hudTop { top: max(10px, env(safe-area-inset-top)); display: grid; grid-template-columns: 1fr auto 1fr; }
  #hudTop #fish { justify-self: start; }
  #hudTop #giftBtn { justify-self: end; }
  .pill {
    background: rgba(255, 254, 246, .92); border: 2.5px solid var(--ink); border-radius: 999px;
    padding: 4px 14px; font-weight: 600; backdrop-filter: blur(4px);
  }
  .fish { background: var(--pond); color: #fff; min-width: 76px; text-align: center; transition: transform .2s; }
  .fish.bump { transform: scale(1.15); }
  #roomName { text-align: center; line-height: 1.15; padding: 3px 16px; }
  #roomName .ja { display: block; font-size: 1.35rem; color: var(--leaf); }
  #roomName small { color: var(--muted); font-weight: 500; font-size: .78rem; }
  .btn {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--sun);
    border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer; box-shadow: 0 3px 0 var(--ink);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn:disabled { background: #E6E1D6; color: var(--muted); cursor: default; box-shadow: 0 3px 0 #B8AFA2; border-color: #B8AFA2; }
  .btn.plain { background: var(--paper); }

  #hudBottom { bottom: max(12px, env(safe-area-inset-bottom)); justify-content: center; flex-direction: column; gap: 8px; }
  .dots { display: flex; gap: 6px; }
  .dot {
    font: inherit; color: var(--ink); cursor: pointer; border: 2.5px solid var(--ink); border-radius: 999px;
    background: rgba(255, 254, 246, .75); padding: 2px 12px; font-size: .85rem; font-weight: 600; line-height: 1.5;
  }
  .dot .ja { font-size: 1rem; }
  .dot[aria-current="true"] { background: var(--sun); }
  .dock { display: flex; gap: 10px; }
  .nav {
    position: fixed; top: 50%; z-index: 10; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%;
    border: 2.5px solid var(--ink); background: rgba(255, 254, 246, .9); font-size: 1.4rem; cursor: pointer; display: none; color: var(--ink);
  }
  .nav.l { left: 10px; } .nav.r { right: 10px; }
  @media (hover: hover) and (min-width: 700px) { .nav { display: block; } }
  .nav:disabled { opacity: .3; cursor: default; }

  /* ---------- Sheets ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(40, 33, 28, .45); display: flex; align-items: flex-end; justify-content: center; z-index: 30; }
  .sheet {
    background: var(--paper); width: 100%; max-width: 520px; max-height: 82dvh; overflow-y: auto; border: 3px solid var(--ink); border-bottom: 0;
    border-radius: 26px 26px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); animation: up .25s ease-out;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 { margin: 0 0 4px; font-weight: 600; font-size: 1.25rem; }
  .sheet .portrait { display: flex; gap: 14px; align-items: center; }
  .sheet .portrait > .portrait-cat, .sheet .portrait > .thumb { width: 120px; max-width: none; flex: none; }
  .sheet .ja.big { font-size: 2.1rem; display: block; line-height: 1.2; }
  .sheet { position: relative; }
  .sheet-x { position: absolute; top: 12px; right: 12px; padding: 2px 12px; font-size: 1.1rem; line-height: 1.2; }
  .shop-head h2 { text-align: center; padding-right: 44px; }
  .shop-room { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 6px; }
  .shop-room .btn, .shop-body .btn { padding: 2px 12px; font-size: 1.3rem; line-height: 1.2; flex: none; }
  .shop-body { display: flex; align-items: center; gap: 8px; }
  .shop-body .grid { flex: 1; min-width: 0; grid-template-columns: repeat(2, 1fr); margin-top: 4px; }
  /* Empty slots keep a short last page the same height as a full one. */
  .card.ghost { visibility: hidden; }
  .bag-room { margin: 14px 0 2px; font-size: 1rem; }
  .bag-item { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .bag-item .thumb { width: 64px; flex: none; }
  .bag-item > div:nth-child(2) { flex: 1; }
  .sheet .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .pick, .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
  .pick button { font: inherit; color: var(--ink); background: #F4F7EC; border: 2px solid var(--line); border-radius: 16px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .pick .thumb { max-width: 84px; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 8px 8px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  button.card { font: inherit; color: var(--ink); cursor: pointer; }
  .card .ja { font-size: 1.45rem; line-height: 1.3; }
  .card .en { color: var(--muted); font-size: .88rem; margin-bottom: 8px; }
  .card .btn { margin-top: auto; padding: 4px 12px; font-size: .95rem; }
  .tag { margin-top: auto; font-weight: 600; color: var(--leaf); padding: 5px 0; }
  .muted { color: var(--muted); }

  .placing { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(12px, env(safe-area-inset-bottom)) + 74px); z-index: 20; display: flex; align-items: center; gap: 10px; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 999px; padding: 6px 8px 6px 16px; white-space: nowrap; }
  .placing .btn { padding: 2px 12px; }
  #toasts { position: fixed; left: 50%; transform: translateX(-50%); top: calc(max(10px, env(safe-area-inset-top)) + 64px); z-index: 40; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 400px); }
  .toast { background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 16px; font-weight: 500; text-align: center; animation: toast 3.8s ease forwards; }
  .toast .ja { font-size: 1.1rem; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 8%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  #test { position: fixed; left: 8px; bottom: 80px; z-index: 12; display: flex; flex-direction: column; gap: 6px; }
  #test .btn { font-size: .78rem; padding: 3px 10px; }

  /* ---------- Study desk (a fixed piece of furniture, not one of the four spots) ---------- */
  /* Same box as a spot, so the art (objects/desk.webp) is drawn at the same scale as an item. */
  .desk {
    position: absolute; width: 42%; aspect-ratio: 120 / 100; transform: translateX(-50%); padding: 0; border: 0;
    background: none; cursor: pointer; border-radius: 14px;
  }
  .desk img { display: block; width: 100%; height: 100%; }
  .desk:focus-visible { outline: 3px solid var(--pond); outline-offset: 3px; }

  /* ---------- Study overlay: a study app in a frame, above the game ---------- */
  #study { position: fixed; inset: 0; z-index: 35; background: var(--paper); display: flex; flex-direction: column; }
  .study-bar {
    display: flex; align-items: center; gap: 12px; padding: max(10px, env(safe-area-inset-top)) 12px 10px;
    border-bottom: 2.5px solid var(--ink); background: var(--paper);
  }
  .study-title { font-weight: 600; color: var(--muted); font-size: .95rem; }
  #studyFrame { flex: 1 1 auto; width: 100%; border: 0; background: var(--paper); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } #world { scroll-behavior: auto; } }
</style>
</head>
<body>

<div id="world"></div>

<div class="hud" id="hudTop">
  <div id="fish" class="pill fish" aria-live="polite">🐟 0</div>
  <div id="roomName" class="pill"></div>
  <button id="giftBtn" class="btn" hidden></button>
</div>
<button class="nav l" id="prev" aria-label="Previous room">‹</button>
<button class="nav r" id="next" aria-label="Next room">›</button>
<div class="hud" id="hudBottom">
  <div class="dots" id="dots" role="tablist" aria-label="Rooms"></div>
  <div class="dock">
    <button class="btn" id="shopBtn">Shop <span class="ja" lang="ja">店</span></button>
    <button class="btn plain" id="bagBtn">Bag <span class="ja" lang="ja">袋</span></button>
    <button class="btn plain" id="catsBtn">Cats <span class="ja" lang="ja">猫</span></button>
  </div>
</div>

<div id="test" hidden>
  <button class="btn plain" data-test="fish">+50 fish</button>
  <button class="btn plain" data-test="summon">Summon cats</button>
  <button class="btn plain" data-test="reset">Reset</button>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="placing" class="placing" hidden><span id="placingText"></span> <button class="btn plain" id="placeCancel">Cancel</button></div>
<div id="overlay" class="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="study" hidden>
  <div class="study-bar">
    <button class="btn plain" id="studyBack">‹ Back to the inn</button>
    <span class="study-title" id="studyTitle"></span>
  </div>
  <iframe id="studyFrame" title="Study" src="about:blank"></iframe>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Settings ---------- */
  const ARRIVAL_MINUTES = 10, STAY_MIN = 20, STAY_MAX = 60, MAX_AWAY_HOURS = 24, TICK_MS = 15000, WELCOME_FISH = 10;
  // FISH_KEY is the wallet shared with the study pages (hwg, hbt); they add fish to it.
  const FISH_KEY = 'fish', SAVE_KEY = 'ryokan-save-v1';

  /* ---------- Rooms ----------
     Each room is its own 9:16 picture with its own set of items. SPOTS are
     percentages of that picture: x = centre, y = bottom edge. */
  // Left to right. The game starts in the tatami room, with the dining room on its left and the veranda on its right.
  const ROOMS = [
    { id: 'shokudo', ja: '食事処', tr: 'shokujidokoro', en: 'dining room' },
    { id: 'zashiki', ja: '座敷',   tr: 'zashiki',       en: 'tatami room' },
    { id: 'engawa',  ja: '縁側',   tr: 'engawa',        en: 'veranda' },
    { id: 'onsen',   ja: '温泉',   tr: 'onsen',         en: 'hot spring' }
  ];
  const START_ROOM = 'zashiki';
  // Horizontal centre of the XL row: top row, bottom row.
  const XL_X = [32, 70];
  // How far XL items sit below the middle of their row, in % of the room.
  const XL_DROP = 6;
  const SPOTS = [
    { x: 32, y: 56 }, { x: 68, y: 60 },
    { x: 30, y: 76 }, { x: 70, y: 80 }
  ];
  // The study desk is furniture in the tatami room, not one of the four spots. Tapping it opens study.
  const DESK = { room: 'zashiki', x: 50, y: 47 };
  // The food spot: one fixed place in the dining room, not one of its four item spots. Only
  // one food item can be out at a time, and no cat poses on it or visits it directly. On the open
  // floor near the counter (above both diagonal pairs of regular spots, just below the back wall
  // at y 38), marked by its own placemat (objects/food-mat.webp) so it doesn't blend into the
  // shelf clutter behind it.
  // y nudged down ~30px from 48, then x nudged right ~30px from 50 (same % <-> px ratios as the
  // desk's cqh/cqw nudge: ~9px per 1% of stage height, ~10px per 1% of stage width).
  const FOOD_SPOT = { room: 'shokudo', x: 53, y: 51.3 };

  /* ---------- Items ---------- */
  const CAT_WIDTH = 100;
  const ITEMS = {
    cushion:  { room: 'zashiki', ja: '座布団', tr: 'zabuton', en: 'cushion', price: 100, pose: 'sleep', cat: { x: 50, y: 87.5 } },
    box:      { room: 'zashiki', ja: '箱', tr: 'hako', en: 'box', price: 150, pose: 'sit', hasFront: true, cat: { x: 50, y: 87.5 } },
    basket:   { room: 'zashiki', ja: '籠', tr: 'kago', en: 'basket', price: 300, pose: 'sit', hasFront: true, cat: { x: 50, y: 80 } },
    tent:     { room: 'zashiki', ja: 'テント', tr: 'tento', en: 'tent', price: 500, pose: 'sit', cat: { x: 50, y: 94 } },

    onigiri:  { room: 'shokudo', ja: 'おにぎり', tr: 'onigiri', en: 'rice ball', price: 110, pose: 'sleep', cat: { x: 50, y: 81.5 } },
    takoyaki: { room: 'shokudo', ja: 'たこ焼き', tr: 'takoyaki', en: 'takoyaki', price: 130, pose: 'lie', wobble: true, cat: { x: 80, y: 93 } },
    taiyaki:  { room: 'shokudo', ja: 'たい焼き', tr: 'taiyaki', en: 'taiyaki', price: 160, pose: 'head', cat: { x: 49.39, y: 69.75 } },
    mochi:    { room: 'shokudo', ja: '餅', tr: 'mochi', en: 'mochi', price: 180, pose: 'head', cat: { x: 50, y: 69.5 } },
    // Food: set out at FOOD_SPOT, not one of the four spots above. No cat pose or visitor — see openFood().
    // duration is minutes until it is eaten up and removed from the bag. Ordered cheapest to most
    // expensive, kaiseki is the flagship. tamagoyaki joins here once its art arrives.
    ochazuke: { room: 'shokudo', food: true, duration: 15, ja: 'お茶漬け', tr: 'ochazuke', en: 'rice in tea broth', price: 90 },
    tamagoyaki: { room: 'shokudo', food: true, duration: 20, ja: '卵焼き', tr: 'tamagoyaki', en: 'rolled omelette', price: 115 },
    yakitori: { room: 'shokudo', food: true, duration: 30, ja: '焼き鳥', tr: 'yakitori', en: 'grilled skewers', price: 140 },
    tempura:  { room: 'shokudo', food: true, duration: 40, ja: '天ぷら盛り合わせ', tr: 'tempura moriawase', en: 'assorted tempura', price: 220 },
    chirashi: { room: 'shokudo', food: true, duration: 50, ja: 'ちらし寿司', tr: 'chirashizushi', en: 'scattered sushi bowl', price: 320 },
    unadon:   { room: 'shokudo', food: true, duration: 65, ja: 'うな丼', tr: 'unadon', en: 'grilled eel rice bowl', price: 420 },
    kaiseki:  { room: 'shokudo', food: true, duration: 90, ja: '懐石', tr: 'kaiseki', en: 'formal multi-course set', price: 600 },
    'taiyaki-xl': { room: 'onsen', ja: '大きなたい焼き', tr: 'ookina taiyaki', en: 'big taiyaki', price: 280, pose: 'ride', poses: ['ride', 'half', 'soak'], cat: { x: 56.25, y: 65 }, offset: { rimon: { x: 0, y: 0.5, s: 1 }, pilpel: { x: 0, y: 0, s: 1.05 } } },
    stool:    { room: 'onsen', ja: '腰掛け', tr: 'koshikake', en: 'stool', price: 200, pose: 'sit', poses: ['sit', 'sleep'], cat: { x: 50, y: 68 }, poseOffset: { sleep: { x: 0, y: 2.8 } } },
    'onsen-clay': { room: 'onsen', xl: true, poses: ['half', 'soak'], water: { x: 50, y: 23.9, w: 92.6, steamDy: 10.6 }, ja: '土風呂', tr: 'tsuchi-buro', en: 'clay bath', price: 300, pose: 'half', scale: 2, cat: { x: 50, y: 62 }, poseOffset: { half: { x: -7.4, y: -28.1 }, soak: { x: -7.4, y: -28.1 } } },
    'onsen-hex': { room: 'onsen', xl: true, poses: ['half', 'soak'], water: { x: 50, y: 28.4, w: 93.0, steamDy: 10.6 }, poseOffset: { half: { x: 0, y: 1.8 } }, ja: '六角風呂', tr: 'rokkaku-buro', en: 'hexagonal bath', price: 380, pose: 'half', scale: 2, cat: { x: 50, y: 62 } },
    'onsen-hinoki': { room: 'onsen', xl: true, poses: ['half', 'soak'], water: { x: 50, y: 31.5, w: 80.5, steamDy: 10.6 }, poseOffset: { half: { x: 0, y: -15.8 }, soak: { x: 0, y: -21.1 } }, ja: '檜風呂', tr: 'hinoki-buro', en: 'hinoki bath', price: 520, pose: 'half', scale: 2, cat: { x: 50, y: 62 } },

    ball:     { room: 'engawa', ja: '毬', tr: 'temari', en: 'ball', price: 120, pose: 'lie', wobble: true, cat: { x: 73, y: 93 } },
    yarn:     { room: 'engawa', ja: '毛糸', tr: 'keito', en: 'ball of yarn', price: 200, pose: 'lie', wobble: true, cat: { x: 73, y: 94 } },
    bonsai:   { room: 'engawa', ja: '盆栽', tr: 'bonsai', en: 'pine bonsai', price: 260, pose: 'sit', cat: { x: 24, y: 87.5 } }
  };
  const POSE_LABEL = { sit: 'sitting', sleep: 'napping', lie: 'lying', head: 'peeking', ride: 'riding', face: 'looking out of', half: 'soaking in', soak: 'soaking' };
  // Poses that have art for every cat.
  const READY_POSES = new Set(['sit', 'sleep', 'lie', 'half', 'soak', 'ride']);

  // ja: the name shown in Japanese. tr: romaji. en: the English meaning, shown on the cat's card.
  const CATS = {
    tapuz:  { ja: 'みかん', tr: 'Mikan', en: 'orange', rarity: 1, likes: { cushion: 3, ball: 2 }, gift: [1, 3] },
    pilpel: { ja: 'こしょう', tr: 'Kosho', en: 'pepper', rarity: 1, likes: { box: 3, tent: 2 }, gift: [1, 3] },
    sheleg: { ja: 'ゆき', tr: 'Yuki', en: 'snow', rarity: .8, likes: { basket: 3, cushion: 2 }, gift: [1, 3] },
    dvash:  { ja: 'ハチ', tr: 'Hachi', en: 'honey', rarity: .9, likes: { yarn: 3, ball: 2 }, gift: [1, 3] },
    shoko:  { ja: 'ココア', tr: 'Kokoa', en: 'chocolate milk', rarity: .9, likes: { ball: 3, box: 2 }, gift: [2, 3] },
    rimon:  { ja: 'ざくろ', tr: 'Zakuro', en: 'pomegranate', rarity: .5, likes: { yarn: 2, basket: 2 }, gift: [3, 5] },
    kokhav: { ja: 'ほし', tr: 'Hoshi', en: 'star', rarity: .25, likes: { tent: 4 }, gift: [5, 8] }
  };
  const CAT_ORDER = Object.keys(CATS);

  // Study modules: one line each to add. Every module is a page on this site, so it can share the 'fish' wallet.
  const STUDY = [
    { id: 'hwg', name: 'Word builder', sub: 'Build words from their parts', href: '../hwg/' },
    { id: 'hbt', name: 'Interlinear practice', sub: 'Read the text line by line', href: '../hbt/' }
  ];
  // Messages from a study page: { type: 'neko-ryokan:fish', amount, source }. Only these origins may award fish.
  const STUDY_ORIGINS = [location.origin];
  const STUDY_MAX_FISH = 50;

  /* ---------- Storage ---------- */
  const mem = {};
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return k in mem ? mem[k] : null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
    remove(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
  };
  const getFish = () => { const n = parseInt(store.get(FISH_KEY) || '0', 10); return Number.isFinite(n) && n > 0 ? n : 0; };
  const setFish = (n) => { store.set(FISH_KEY, String(Math.max(0, Math.floor(n)))); renderWallet(true); };

  const freshSpots = () => { const o = {}; ROOMS.forEach((r) => { o[r.id] = SPOTS.map(() => null); }); return o; };
  const freshState = () => ({ owned: [], spots: freshSpots(), visitors: {}, gifts: 0, seen: {}, lastCheck: null, welcomed: false, food: null });
  function load() {
    const s = freshState();
    try { const raw = store.get(SAVE_KEY); if (raw) Object.assign(s, JSON.parse(raw)); } catch (e) { /* start fresh */ }
    ROOMS.forEach((r) => { if (!s.spots[r.id]) s.spots[r.id] = SPOTS.map(() => null); });
    // Owned items that were removed from the shop would break the spot picker, so drop them.
    s.owned = s.owned.filter((id) => ITEMS[id]);
    if (s.food && !(ITEMS[s.food.id] && ITEMS[s.food.id].food)) s.food = null;
    // Tidy saves from before XL items and removed items: drop unknown ids, and give both spots of an XL row the item.
    ROOMS.forEach((r) => {
      const sp = s.spots[r.id];
      sp.forEach((id, i) => { if (id && !ITEMS[id]) sp[i] = null; });
      for (let a = 0; a < sp.length; a += 2) {
        const id = sp[a] || sp[a + 1];
        if (id && ITEMS[id].xl) { sp[a] = id; sp[a + 1] = id; }
      }
    });
    return s;
  }
  let state = load();
  const save = () => store.set(SAVE_KEY, JSON.stringify(state));

  /* ---------- Helpers ---------- */
  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const jaSpan = (t) => `<span class="ja" lang="ja">${t}</span>`;
  const key = (room, i) => room + ':' + i;
  const isFoodPlaced = (id) => !!(state.food && state.food.id === id);
  const isPlaced = (id) => isFoodPlaced(id) || ROOMS.some((r) => state.spots[r.id].includes(id));
  // Whether putting this item out right now would find somewhere to go (a free regular spot, or
  // the food spot if it is food and empty), used to decide whether buying/put-out jumps straight
  // into placing mode or just leaves the item waiting in the Bag.
  const canPlaceNow = (id) => ITEMS[id].food ? !state.food : freeSpotFor(ITEMS[id].room, id) !== -1;
  // XL items take a whole row of two spots (0+1 or 2+3). The first spot holds the item and is where it is drawn;
  // the second spot holds the same id, so it is blocked, but it is not drawn or visited on its own.
  const isXL = (id) => !!(id && ITEMS[id].xl);
  const rowStart = (i) => i - (i % 2);
  const isSecondary = (roomId, i) => isXL(state.spots[roomId][i]) && i % 2 === 1;
  const fits = (roomId, i, id) => !ITEMS[id].xl || (!state.spots[roomId][rowStart(i)] && !state.spots[roomId][rowStart(i) + 1]);
  function placeItem(roomId, i, id) {
    const s = state.spots[roomId];
    if (ITEMS[id].xl) { s[rowStart(i)] = id; s[rowStart(i) + 1] = id; } else s[i] = id;
  }
  function clearItem(roomId, i) {
    const s = state.spots[roomId];
    if (isXL(s[i])) { s[rowStart(i)] = null; s[rowStart(i) + 1] = null; } else s[i] = null;
  }
  const art = { cat: (c, p) => `cats/${c}/${p}.webp`, item: (id) => `objects/${id}.webp`, front: (id) => `objects/${id}-front.webp` };
  // Steam rises from the same box as the water, so it only needs the bath's existing water position.
  // steamDy nudges the steam's start point down from the water's own position, without moving the water.
  const steamHtml = (w) => { const sy = w.y + (w.steamDy || 0); return `<div class="steam" style="--sx:${w.x}%;--sy:${sy}%;--sw:${w.w}%">` +
    [[8, 0, 5], [38, 1.3, 6], [66, 2.6, 5.5]].map(([left, delay, dur]) =>
      `<span class="puff" style="left:${left}%;animation-delay:${delay}s;animation-duration:${dur}s"></span>`).join('') + `</div>`; };

  // inSpot: on the floor, an item can be drawn larger (it.scale) from its base. The shop thumbnail keeps the normal size.
  function itemLayers(id, inSpot) {
    const it = ITEMS[id], grow = inSpot && it.scale ? ` style="transform:scale(${it.scale});transform-origin:50% 90%"` : '';
    return {
      back: `<img class="layer${it.wobble ? ' wobble' : ''}" src="${art.item(id)}" alt=""${grow}>`,
      front: it.hasFront ? `<img class="layer" src="${art.front(id)}" alt="">` : ''
    };
  }
  const thumb = (id) => { const L = itemLayers(id); return `<div class="thumb">${L.back}${L.front}</div>`; };
  const catPortrait = (id, sil) => `<div class="portrait-cat${sil ? ' sil' : ''}"><img src="${art.cat(id, 'sit')}" alt=""></div>`;
  function catLayer(v, it) {
    const pose = v.pose || it.pose;
    const o = (it.offset && it.offset[v.cat]) || { x: 0, y: 0, s: 1 };
    const po = (it.poseOffset && it.poseOffset[pose]) || { x: 0, y: 0 };
    const x = it.cat.x + o.x + po.x, y = it.cat.y + o.y + po.y, w = CAT_WIDTH * (it.catScale || 1) * (o.s || 1);
    return `<div class="cat-layer${v.fresh ? ' cat-in' : ''}" style="left:${x - w * 0.5}%;top:${y - w * 0.97}%;width:${w}%">` +
      `<img class="${pose === 'sleep' ? 'breathe' : ''}" src="${art.cat(v.cat, pose)}" alt=""></div>`;
  }

  /* ---------- Visiting logic (same rules as the yard, now per room) ---------- */
  function pickCat(itemId, present) {
    const pool = CAT_ORDER.filter((id) => !present.has(id)).map((id) => ({ id, w: CATS[id].rarity * (CATS[id].likes[itemId] || 0.4) }));
    const total = pool.reduce((a, b) => a + b.w, 0);
    if (!total) return null;
    let r = Math.random() * total;
    for (const p of pool) { r -= p.w; if (r <= 0) return p.id; }
    return pool[pool.length - 1].id;
  }
  // A visit's pose is picked at random from the item's poses that have art.
  function pickPose(it) {
    const ok = (it.poses || [it.pose]).filter((p) => READY_POSES.has(p));
    return ok.length ? ok[Math.floor(Math.random() * ok.length)] : it.pose;
  }
  function simulate(now) {
    const ev = { arrived: [], changed: false, span: 0 };
    if (state.lastCheck == null) { state.lastCheck = now; ev.changed = true; return ev; }
    const span = Math.max(0, Math.min(now - state.lastCheck, MAX_AWAY_HOURS * 3600e3));
    const start = now - span;
    ev.span = span;
    Object.keys(state.visitors).forEach((k) => {
      const v = state.visitors[k], [room, i] = k.split(':');
      if (now >= v.leave || !state.spots[room][+i]) { state.gifts += v.gift; delete state.visitors[k]; ev.changed = true; }
    });
    // Food is eaten up after its duration: the spot goes empty and the item is gone from the Bag too.
    if (state.food && now >= state.food.expiresAt) {
      state.owned = state.owned.filter((id) => id !== state.food.id);
      state.food = null;
      ev.changed = true;
    }
    const present = new Set(Object.values(state.visitors).map((v) => v.cat));
    if (span > 0) {
      ROOMS.forEach((r) => state.spots[r.id].forEach((itemId, i) => {
        const k = key(r.id, i);
        if (!itemId || state.visitors[k] || isSecondary(r.id, i)) return;
        if (Math.random() >= 1 - Math.exp(-span / (ARRIVAL_MINUTES * 60e3))) return;
        const cat = pickCat(itemId, present);
        if (!cat) return;
        present.add(cat);
        const arrive = start + Math.random() * span, leave = arrive + rand(STAY_MIN, STAY_MAX) * 60e3;
        const gift = randInt(CATS[cat].gift[0], CATS[cat].gift[1]);
        state.seen[cat] = (state.seen[cat] || 0) + 1;
        ev.arrived.push({ cat, room: r.id });
        ev.changed = true;
        if (leave <= now) state.gifts += gift; else state.visitors[k] = { cat, pose: pickPose(ITEMS[itemId]), arrive, leave, gift, fresh: true };
      }));
    }
    state.lastCheck = now;
    return ev;
  }
  function tick(summary) {
    const ev = simulate(Date.now());
    if (ev.changed) { save(); renderRooms(); renderWallet(); }
    if (!ev.arrived.length) return;
    if (summary && ev.span > 60e3) toast(`While you were away, ${ev.arrived.length} cat${ev.arrived.length > 1 ? 's' : ''} visited.`);
    else ev.arrived.forEach((a) => { const r = ROOMS.find((x) => x.id === a.room); toast(`${jaSpan(CATS[a.cat].ja)} ${CATS[a.cat].tr} came to the ${jaSpan(r.ja)} ${r.en}!`); });
  }

  /* ---------- Rendering ---------- */
  const world = $('world');
  let cur = ROOMS.findIndex((r) => r.id === START_ROOM);
  function spotHtml(room, i) {
    if (isSecondary(room.id, i)) return '';
    const itemId = state.spots[room.id][i], v = state.visitors[key(room.id, i)];
    // An XL item is drawn at the middle of its row. Rows can sit left or right, so the baths form a diagonal.
    const p = isXL(itemId) ? { x: XL_X[i >= 2 ? 1 : 0], y: (SPOTS[i].y + SPOTS[i + 1].y) / 2 + XL_DROP } : SPOTS[i];
    let inner, label;
    if (!itemId) {
      inner = `<svg class="layer" viewBox="0 0 120 100" aria-hidden="true"><g class="empty-mark"><ellipse cx="60" cy="90" rx="30" ry="8" fill="rgba(255,255,255,.28)" stroke="#fff" stroke-width="2" stroke-dasharray="5 5"/><path d="M60 84 V96 M54 90 H66" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></g></svg>`;
      label = 'Empty spot. Put out an item.';
    } else {
      const it = ITEMS[itemId], L = itemLayers(itemId, true);
      const water = it.water ? `<img class="water" src="objects/${itemId}-water.webp" alt="" style="left:${it.water.x}%;top:${it.water.y}%;width:${it.water.w}%">` : '';
      const steam = it.water ? steamHtml(it.water) : '';
      inner = L.back + water + (v ? catLayer(v, it) : '') + L.front + steam;
      label = v ? `${CATS[v.cat].tr} ${POSE_LABEL[v.pose || it.pose]} on the ${it.en}` : `${it.tr} (${it.en})`;
      if (v) v.fresh = false;
    }
    return `<button class="spot" data-room="${room.id}" data-i="${i}" aria-label="${label}" style="left:${p.x}%;bottom:${100 - p.y}%;z-index:${p.y}">${inner}</button>`;
  }
  // The study desk: fixed furniture in the tatami room (objects/desk.webp). Tapping it opens the study menu.
  function deskHtml() {
    // Nudges are in container units (share of the picture), so the desk stays in the same place on every screen.
    // 3.5 cqw and 6.7 cqh equal 35px and 60px on a 900px-tall screen. It is above the spots, whose transparent boxes would otherwise catch its taps.
    return `<button class="desk" data-desk aria-label="Study desk. Open the study menu." style="left:calc(${DESK.x}% + 3.5cqw);bottom:calc(${100 - DESK.y}% - 6.7cqh);z-index:90">` +
      `<img src="objects/desk.webp" alt=""></button>`;
  }
  // The food spot: one fixed place in the dining room, separate from its four item spots. The
  // placemat (objects/food-mat.webp) is always drawn, placed or not, so it alone marks this as the
  // only spot where food can go — no dashed empty-mark needed, unlike a regular spot.
  function foodHtml() {
    const f = state.food;
    const mat = `<img class="layer" src="objects/food-mat.webp" alt="">`;
    let inner, label;
    if (!f) {
      inner = mat;
      label = 'Food spot, empty. Set out food for the cats here.';
    } else {
      const it = ITEMS[f.id], L = itemLayers(f.id, true);
      inner = mat + L.back + L.front;
      label = `${it.tr} (${it.en}), set out at the food spot`;
    }
    // z-index 95: above every regular spot (max 80), the same fix as the study desk — a regular
    // spot's invisible button box is much bigger than its art and was swallowing the food spot's taps.
    return `<button class="spot food-spot" data-food aria-label="${label}" style="left:${FOOD_SPOT.x}%;bottom:${100 - FOOD_SPOT.y}%;z-index:95">${inner}</button>`;
  }
  // The picture is six rooms wide: a margin, the four rooms, and a margin. The margins have no spots or desk.
  // They are only ever seen beside the first and last rooms.
  const MARGINS = { left: { id: 'margin-left', en: 'dining room wall', slice: 0 }, right: { id: 'margin-right', en: 'garden', slice: 5 } };
  function renderRooms() {
    const sections = [{ ...MARGINS.left, margin: true }, ...ROOMS.map((r, i) => ({ ...r, slice: i + 1 })), { ...MARGINS.right, margin: true }];
    world.innerHTML = sections.map((r) =>
      `<section class="room r-${r.id}" style="--slice:${r.slice}" aria-label="${r.en}"><div class="stage"><div class="bg"></div><div class="tint"></div>` +
      (r.margin ? '' : SPOTS.map((_, i) => spotHtml(r, i)).join('') + (r.id === DESK.room ? deskHtml() : '') + (r.id === FOOD_SPOT.room ? foodHtml() : '')) +
      `</div></section>`).join('');
    applyTimeOfDay();
    placeRooms();
  }
  function renderChrome() {
    const r = ROOMS[cur];
    $('roomName').innerHTML = `${jaSpan(r.ja)}<small>${r.en}</small>`;
    $('prev').disabled = cur === 0; $('next').disabled = cur === ROOMS.length - 1;
    $('dots').innerHTML = ROOMS.map((x, i) =>
      `<button class="dot" role="tab" data-go="${i}" aria-current="${i === cur}" aria-label="${x.en}">${i === cur ? jaSpan(x.ja) : (i + 1)}</button>`).join('');
  }
  function renderWallet(bump) {
    const el = $('fish');
    el.textContent = '🐟 ' + getFish();
    if (bump) { el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 220); }
    $('giftBtn').hidden = !state.gifts;
    $('giftBtn').textContent = `🎁 ${state.gifts}`;
  }
  // Each section sits at its offset from the current room: 0 in the middle, -1 to the left, +1 to the right.
  // The current room is at position cur + 1, because the left margin is section 0. Nothing wraps.
  function placeRooms() {
    [...world.children].forEach((el, k) => {
      const d = k - (cur + 1);
      // A section that moves more than one place (a jump with the dots) appears in place rather than flying across.
      // Only sections that move one place slide.
      const prev = el.dataset.d === undefined ? null : +el.dataset.d;
      el.dataset.d = d;
      const jump = prev === null || Math.abs(d - prev) > 1;
      if (jump) el.style.transition = 'none';
      el.style.transform = `translateX(calc(-50% + ${d} * var(--W)))`;
      if (jump) { void el.offsetWidth; el.style.transition = ''; }
      el.classList.toggle('current', d === 0);
    });
  }
  // The rooms run in a line and stop at the ends. The margins beside the first and last rooms show the picture beyond them.
  function goRoom(i) {
    const next = Math.max(0, Math.min(ROOMS.length - 1, i));
    if (next === cur) return;
    cur = next;
    placeRooms(); renderChrome();
  }
  function stepRoom(dir) { goRoom(cur + dir); }

  /* ---------- Sheets ---------- */
  let sheetCtx = null;
  function openSheet(html) {
    $('sheet').innerHTML = html; $('overlay').hidden = false;
    const f = $('sheet').querySelector('button'); if (f) f.focus();
  }
  function closeSheet() { $('overlay').hidden = true; sheetCtx = null; }

  function openSpot(roomId, i) {
    sheetCtx = { roomId, i };
    const itemId = state.spots[roomId][i], v = state.visitors[key(roomId, i)];
    if (v) {
      const c = CATS[v.cat], it = ITEMS[itemId], mins = Math.max(1, Math.round((v.leave - Date.now()) / 60e3));
      openSheet(`<div class="portrait">${catPortrait(v.cat)}<div><div class="ja">${c.ja}</div><h2>${c.tr}</h2><div class="muted">“${c.en}”</div>
        <p>${POSE_LABEL[v.pose || it.pose][0].toUpperCase() + POSE_LABEL[v.pose || it.pose].slice(1)} on the ${jaSpan(it.ja)}. Staying about ${mins} more minute${mins > 1 ? 's' : ''}.</p></div></div>
        <div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
    } else if (itemId) {
      const it = ITEMS[itemId];
      openSheet(`<div class="portrait">${thumb(itemId)}<div><span class="ja big" lang="ja">${it.ja}</span><h2>${it.tr}</h2><div class="muted">${it.en}</div><p>No one here yet.</p></div></div>
        <div class="row"><button class="btn plain" data-act="remove">Put it away</button><button class="btn" data-act="close">Close</button></div>`);
    } else {
      const room = ROOMS.find((r) => r.id === roomId);
      const free = state.owned.filter((id) => ITEMS[id].room === roomId && !ITEMS[id].food && !isPlaced(id) && fits(roomId, i, id));
      const body = free.length
        ? `<div class="pick">${free.map((id) => `<button data-place="${id}">${thumb(id)}${jaSpan(ITEMS[id].ja)}<span>${ITEMS[id].tr}</span></button>`).join('')}</div>`
        : `<p class="muted">You have nothing for the ${room.en} yet. Open the shop to buy something for this room.</p>`;
      openSheet(`<h2>Put out an item · ${jaSpan(room.ja)}</h2>${body}<div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
    }
  }
  // The food spot: no visitor, just the food itself and when it will be eaten up.
  function openFood() {
    const f = state.food;
    if (f) {
      const it = ITEMS[f.id], mins = Math.max(1, Math.round((f.expiresAt - Date.now()) / 60e3));
      openSheet(`<div class="portrait">${thumb(f.id)}<div><span class="ja big" lang="ja">${it.ja}</span><h2>${it.tr}</h2><div class="muted">${it.en}</div><p>Set out for the cats. Gone in about ${mins} minute${mins > 1 ? 's' : ''}.</p></div></div>
        <div class="row"><button class="btn plain" data-act="food-remove">Put it away</button><button class="btn" data-act="close">Close</button></div>`);
    } else {
      const room = ROOMS.find((r) => r.id === FOOD_SPOT.room);
      const free = state.owned.filter((id) => ITEMS[id].food);
      const body = free.length
        ? `<div class="pick">${free.map((id) => `<button data-place-food="${id}">${thumb(id)}${jaSpan(ITEMS[id].ja)}<span>${ITEMS[id].tr}</span></button>`).join('')}</div>`
        : `<p class="muted">You have no food yet. Open the shop to buy some for the ${room.en}.</p>`;
      openSheet(`<h2>Set out food · ${jaSpan(room.ja)}</h2>${body}<div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
    }
  }
  // The shop browses the rooms with the ‹ › buttons, one page per room, in ROOMS order, except
  // Food leads as its own page before every room — it's a separate kind of item (consumable, set
  // out at FOOD_SPOT, not one of the four regular spots), so it reads oddly mixed into the dining
  // room's furniture page. sectionFor() maps a game room to its shop page, skipping over Food.
  const SHOP_SECTIONS = [{ kind: 'food' }, ...ROOMS.map((r) => ({ kind: 'room', room: r }))];
  const sectionFor = (roomId) => SHOP_SECTIONS.findIndex((s) => s.kind === 'room' && s.room.id === roomId);
  let shopIdx = 0, shopPage = 0;
  const SHOP_PAGE = 4;   // items per screen, as a 2 x 2 grid
  function openShop(idx) {
    if (idx !== undefined) {
      const n = ((idx % SHOP_SECTIONS.length) + SHOP_SECTIONS.length) % SHOP_SECTIONS.length;
      if (n !== shopIdx) shopPage = 0;
      shopIdx = n;
    }
    const section = SHOP_SECTIONS[shopIdx], fish = getFish();
    const label = section.kind === 'food' ? { ja: '食', en: 'food' } : { ja: section.room.ja, en: section.room.en };
    const all = (section.kind === 'food'
      ? Object.keys(ITEMS).filter((id) => ITEMS[id].food)
      : Object.keys(ITEMS).filter((id) => ITEMS[id].room === section.room.id && !ITEMS[id].food)
    ).sort((a, b) => ITEMS[a].price - ITEMS[b].price);
    const pages = Math.max(1, Math.ceil(all.length / SHOP_PAGE));
    shopPage = Math.min(shopPage, pages - 1);
    const ids = all.slice(shopPage * SHOP_PAGE, (shopPage + 1) * SHOP_PAGE);
    // Item pages: the middle arrows only show when the room has more than one page of four.
    const pager = (dir, pageLabel) => pages > 1 ? `<button class="btn plain" data-shop-page="${dir}" aria-label="${pageLabel}" ${shopPage + dir < 0 || shopPage + dir >= pages ? 'disabled' : ''}>${dir < 0 ? '‹' : '›'}</button>` : '<span></span>';
    openSheet(`<button class="btn plain sheet-x" data-act="close" aria-label="Close">✕</button>` +
      `<div class="shop-head"><h2>Shop</h2></div>` +
      `<div class="shop-room"><button class="btn plain" data-shop-step="-1" aria-label="Previous">‹</button>` +
      `<span>${jaSpan(label.ja)} <span class="muted">${label.en}</span></span>` +
      `<button class="btn plain" data-shop-step="1" aria-label="Next">›</button></div>` +
      `<div class="shop-body">${pager(-1, 'Earlier items')}<div class="grid">${ids.map((id) => {
      const it = ITEMS[id], owned = state.owned.includes(id);
      const act = owned ? `<div class="tag">${isPlaced(id) ? 'Out in a room' : 'Owned'}</div>`
        : `<button class="btn" data-buy="${id}" ${fish < it.price ? 'disabled' : ''}>${it.price} 🐟</button>`;
      return `<div class="card">${thumb(id)}${jaSpan(it.ja)}<div class="en">${it.en}</div>${act}</div>`;
    }).join('')}${'<div class="card ghost" aria-hidden="true"><div class="thumb"></div><span class="ja">&nbsp;</span><div class="en">&nbsp;</div><span class="btn">&nbsp;</span></div>'.repeat(SHOP_PAGE - ids.length)}</div>${pager(1, 'Later items')}</div>`);
  }
  // The bag lists everything bought, by room. Items out in a room say where they are.
  const spotOf = (id) => { for (const r of ROOMS) { const i = state.spots[r.id].indexOf(id); if (i !== -1) return { roomId: r.id, i }; } return null; };
  // The first empty spot in a room the item fits, with no cat visiting it.
  const freeSpotFor = (roomId, id) => SPOTS.findIndex((_, i) => !state.spots[roomId][i] && !state.visitors[key(roomId, i)] && fits(roomId, i, id));
  // Put out: the player picks the spot. The item waits in 'placing' until a spot is tapped or Cancel.
  let placing = null;
  function startPlacing(id) {
    const it = ITEMS[id];
    placing = id;
    $('placingText').innerHTML = `Tap ${it.food ? 'the food spot' : 'a spot'} for ${jaSpan(it.ja)} ${it.tr}`;
    $('placing').hidden = false;
  }
  function endPlacing() { placing = null; $('placing').hidden = true; }
  function placeAt(roomId, i) {
    const id = placing;
    if (ITEMS[id].food) { toast(`${jaSpan(ITEMS[id].ja)} can only be set out at the food spot in the dining room.`); return; }
    if (state.spots[roomId][i] || state.visitors[key(roomId, i)]) { toast('That spot is taken. Tap an empty one.'); return; }
    if (!fits(roomId, i, id)) { toast(`${jaSpan(ITEMS[id].ja)} needs two empty spots side by side.`); return; }
    placeItem(roomId, i, id); save(); endPlacing(); renderRooms();
  }
  function placeFoodAt() {
    const id = placing;
    if (!ITEMS[id].food) { toast(`${jaSpan(ITEMS[id].ja)} can't go at the food spot. Tap a regular spot instead.`); return; }
    if (state.food) { toast('The food spot is already in use.'); return; }
    state.food = { id, expiresAt: Date.now() + ITEMS[id].duration * 60e3 };
    save(); endPlacing(); renderRooms();
  }
  function openBag() {
    const rooms = ROOMS.map((r) => {
      const ids = state.owned.filter((id) => ITEMS[id].room === r.id);
      if (!ids.length) return '';
      return `<h3 class="bag-room">${jaSpan(r.ja)} <span class="muted">${r.en}</span></h3>` + ids.map((id) => {
        const it = ITEMS[id], at = it.food ? isFoodPlaced(id) : spotOf(id);
        const act = at ? `<button class="btn plain" data-bag-away="${id}">Put away</button>` : `<button class="btn" data-bag-out="${id}">Put out</button>`;
        return `<div class="bag-item">${thumb(id)}<div>${jaSpan(it.ja)}<div class="en">${it.en}${at ? ' · out now' : ''}</div></div>${act}</div>`;
      }).join('');
    }).join('');
    openSheet(`<button class="btn plain sheet-x" data-act="close" aria-label="Close">✕</button><h2>Bag · <span class="ja" lang="ja">袋</span></h2>` +
      (rooms || '<p class="muted">Nothing in your bag yet. Open the shop to buy something.</p>'));
  }
  function openCats() {
    openSheet(`<h2>Cats <span class="ja" lang="ja">猫</span></h2><div class="grid">${CAT_ORDER.map((id) => {
      const c = CATS[id], n = state.seen[id] || 0;
      if (!n) return `<div class="card">${catPortrait(id, true)}<div class="ja">?</div><div class="en">Not met yet</div></div>`;
      const fav = Object.keys(c.likes).sort((a, b) => c.likes[b] - c.likes[a])[0];
      return `<div class="card">${catPortrait(id)}<div class="ja">${c.ja}</div><div class="en">${c.tr} · “${c.en}”</div><div class="muted" style="font-size:.82rem">Visits ${n} · loves ${jaSpan(ITEMS[fav].ja)}</div></div>`;
    }).join('')}</div><div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
  }

  // The study desk: pick a module, and it opens full screen in a frame. Fish earned there go to the shared wallet.
  function openDesk() {
    openSheet(`<h2>Study desk</h2><p class="muted">Practise here to earn fish. Spend them on the inn.</p>` +
      `<div class="grid">${STUDY.map((m) => `<button class="card" data-study="${m.id}"><div class="ja">${m.name}</div><div class="en">${m.sub}</div><span class="btn" style="pointer-events:none">Open</span></button>`).join('')}</div>` +
      `<div class="row"><button class="btn plain" data-act="close">Close</button></div>`);
  }
  let studyId = null;
  function openStudy(id) {
    const m = STUDY.find((x) => x.id === id); if (!m) return;
    studyId = id;
    $('studyTitle').textContent = m.name;
    $('studyFrame').src = m.href;
    $('study').hidden = false;
    $('studyBack').focus();
  }
  function closeStudy() {
    if (studyId === null) return;
    studyId = null;
    $('study').hidden = true;
    $('studyFrame').src = 'about:blank';
    renderWallet(); tick(false);
  }

  function toast(html) {
    const t = document.createElement('div');
    t.className = 'toast'; t.innerHTML = html; $('toasts').appendChild(t);
    setTimeout(() => t.remove(), 3900);
  }

  /* ---------- Events ---------- */
  world.addEventListener('click', (e) => {
    const b = e.target.closest('[data-room]'), foodBtn = e.target.closest('[data-food]');
    if (b && placing) placeAt(b.dataset.room, +b.dataset.i);
    else if (b) openSpot(b.dataset.room, +b.dataset.i);
    else if (foodBtn && placing) placeFoodAt();
    else if (foodBtn) openFood();
    if (e.target.closest('[data-desk]')) openDesk();
  });
  $('sheet').addEventListener('click', (e) => {
    const place = e.target.closest('[data-place]'), act = e.target.closest('[data-act]'), buy = e.target.closest('[data-buy]'), study = e.target.closest('[data-study]');
    const placeFood = e.target.closest('[data-place-food]');
    const shopStep = e.target.closest('[data-shop-step]');
    const bagOut = e.target.closest('[data-bag-out]'), bagAway = e.target.closest('[data-bag-away]');
    const shopPageBtn = e.target.closest('[data-shop-page]');
    if (shopStep) openShop(shopIdx + +shopStep.dataset.shopStep);
    else if (shopPageBtn) { shopPage += +shopPageBtn.dataset.shopPage; openShop(shopIdx); }
    else if (bagOut) {
      const id = bagOut.dataset.bagOut, it = ITEMS[id];
      if (!canPlaceNow(id)) { toast(it.food ? 'The food spot is already in use. Put it away first.' : `No empty spot in the ${ROOMS.find((r) => r.id === it.room).en} for ${jaSpan(it.ja)}. Put something away first.`); return; }
      closeSheet(); startPlacing(id); goRoom(ROOMS.findIndex((r) => r.id === it.room));
    } else if (bagAway) {
      const id = bagAway.dataset.bagAway;
      if (ITEMS[id].food) { state.food = null; } else { const at = spotOf(id); clearItem(at.roomId, at.i); }
      save(); renderRooms(); openBag();
    } else if (place && sheetCtx) { placeItem(sheetCtx.roomId, sheetCtx.i, place.dataset.place); save(); closeSheet(); renderRooms(); }
    else if (placeFood) { state.food = { id: placeFood.dataset.placeFood, expiresAt: Date.now() + ITEMS[placeFood.dataset.placeFood].duration * 60e3 }; save(); closeSheet(); renderRooms(); }
    else if (act && act.dataset.act === 'remove' && sheetCtx) { clearItem(sheetCtx.roomId, sheetCtx.i); save(); closeSheet(); renderRooms(); }
    else if (act && act.dataset.act === 'food-remove') { state.food = null; save(); closeSheet(); renderRooms(); }
    else if (buy) {
      const id = buy.dataset.buy, it = ITEMS[id], fish = getFish();
      if (state.owned.includes(id) || fish < it.price) return;
      state.owned.push(id); save(); setFish(fish - it.price);
      // Go straight to choosing a spot, as Put out in the Bag does. If there's nowhere for it yet, it waits in the Bag.
      if (!canPlaceNow(id)) { toast(`Bought ${jaSpan(it.ja)} ${it.tr}. ${it.food ? 'The food spot is already in use.' : 'No empty spot in that room yet.'} It is in your Bag.`); openShop(shopIdx); return; }
      closeSheet(); startPlacing(id); goRoom(ROOMS.findIndex((r) => r.id === it.room));
    } else if (study) { closeSheet(); openStudy(study.dataset.study); }
    else if (act) closeSheet();
  });
  $('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeSheet(); });
  $('studyBack').addEventListener('click', closeStudy);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !$('overlay').hidden) closeSheet();
    else if (e.key === 'Escape' && studyId !== null) closeStudy();
    if ($('overlay').hidden && studyId === null && e.key === 'ArrowLeft') stepRoom(-1);
    if ($('overlay').hidden && studyId === null && e.key === 'ArrowRight') stepRoom(1);
  });
  $('dots').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) goRoom(+b.dataset.go); });
  $('prev').addEventListener('click', () => stepRoom(-1));
  $('next').addEventListener('click', () => stepRoom(1));
  // Swipe left or right to move. A tap, or a drag that starts on a spot, still works as before.
  let swipeX = null;
  world.addEventListener('pointerdown', (e) => { swipeX = e.clientX; });
  world.addEventListener('pointerup', (e) => {
    if (swipeX === null) return;
    const dx = e.clientX - swipeX; swipeX = null;
    if (Math.abs(dx) > 40 && studyId === null && $('overlay').hidden) stepRoom(dx < 0 ? 1 : -1);
  });
  $('shopBtn').addEventListener('click', () => openShop(sectionFor(ROOMS[cur].id)));
  $('catsBtn').addEventListener('click', openCats);
  $('bagBtn').addEventListener('click', openBag);
  $('placeCancel').addEventListener('click', endPlacing);
  $('giftBtn').addEventListener('click', () => {
    const n = state.gifts; if (!n) return;
    state.gifts = 0; save(); setFish(getFish() + n); toast(`Collected ${n} 🐟 from your visitors.`);
  });
  // Fish from a study page. Only a message from an allowed origin, sent by the open study frame, counts.
  window.addEventListener('message', (e) => {
    if (!STUDY_ORIGINS.includes(e.origin) || studyId === null || e.source !== $('studyFrame').contentWindow) return;
    const d = e.data;
    if (!d || d.type !== 'neko-ryokan:fish') return;
    const amount = Math.floor(Number(d.amount));
    if (!(amount > 0) || amount > STUDY_MAX_FISH) return;
    setFish(getFish() + amount);
    toast(`+${amount} 🐟 from your study.`);
  });
  // If a study page adds fish in another tab (or in the frame, through the shared storage), update the count here.
  window.addEventListener('storage', (e) => { if (e.key === FISH_KEY) renderWallet(true); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderWallet(); tick(true); } });

  /* ---------- Testing tools (?test) ---------- */
  const testMode = /[?&]test\b/.test(location.search);
  if (testMode) {
    $('test').hidden = false;
    $('test').addEventListener('click', (e) => {
      const b = e.target.closest('[data-test]'); if (!b) return;
      if (b.dataset.test === 'fish') setFish(getFish() + 50);
      if (b.dataset.test === 'summon') {
        const present = new Set(Object.values(state.visitors).map((v) => v.cat));
        ROOMS.forEach((r) => state.spots[r.id].forEach((itemId, i) => {
          const k = key(r.id, i);
          if (!itemId || state.visitors[k] || isSecondary(r.id, i)) return;
          const cat = pickCat(itemId, present); if (!cat) return;
          present.add(cat); state.seen[cat] = (state.seen[cat] || 0) + 1;
          state.visitors[k] = { cat, pose: pickPose(ITEMS[itemId]), arrive: Date.now(), leave: Date.now() + 40 * 60e3, gift: randInt(...CATS[cat].gift), fresh: true };
        }));
        save(); renderRooms();
      }
      if (b.dataset.test === 'reset' && confirm('Erase the inn, cats and fish?')) { store.remove(SAVE_KEY); store.remove(FISH_KEY); state = freshState(); start(); }
    });
  }

  /* ---------- Time of day: evening is a colour wash over the day art ---------- */
  function applyTimeOfDay() {
    const h = new Date().getHours();
    const evening = (h >= 17 && h < 20) || (h >= 5 && h < 7);
    document.querySelectorAll('.tint').forEach((t) => { t.style.background = evening ? 'linear-gradient(rgba(242,150,110,.28), rgba(242,150,110,.10))' : 'transparent'; });
  }

  function start() {
    if (!state.welcomed) {
      state.welcomed = true; save(); setFish(getFish() + WELCOME_FISH);
      toast(`Welcome to the Ryokan! Swipe sideways to visit the rooms.`);
    }
    renderRooms(); renderChrome(); renderWallet(); tick(true);
  }
  start();
  setInterval(() => { applyTimeOfDay(); tick(false); }, TICK_MS);
})();
</script>
</body>
</html>
